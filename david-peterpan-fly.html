<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Oasis Radio – David as Peter Pan (flying overlay v2)</title>
<meta name="viewport" content="width=720, height=1280, initial-scale=1">
<style>
  /* TikTok LIVE Studio Link / browser source: 720 x 1280, transparent background.
     David hovers in the lower corner (default right). Every 60s (?every=N seconds) he flies a ~15s
     film-style Peter Pan flight (takeoff, big arcs, somersault, crow) with a fairy-dust trail and a
     Tinker Bell light, then settles back to his hover.
     Params: ?pos=left|right  ?every=<sec>  ?test=1 (first flight after 1s)  ?t=<sec> (jump into the first flight, for previews)
             ?dbg=1 (dark background for testing)  ?scale=<0.5-1.5> (size) */
  html, body { margin:0; padding:0; width:720px; height:1280px; overflow:hidden; background:transparent !important; }
  body.dbg { background:#111 !important; }
  #stage { position:relative; width:720px; height:1280px; overflow:hidden; pointer-events:none; }
  #fx { position:absolute; left:0; top:0; width:720px; height:1280px; z-index:1; }
  #david { position:absolute; left:0; top:0; width:640px; height:640px; margin:-320px 0 0 -320px;
           z-index:2; will-change:transform; transform:translate(-2000px,-2000px);
           filter:drop-shadow(0 10px 12px rgba(0,0,0,.35)) drop-shadow(0 0 14px rgba(170,255,120,.22)); }
  #flutter { position:absolute; inset:0; will-change:transform; }
  #flutter img { position:absolute; inset:0; width:640px; height:640px; opacity:0; display:block; }
</style>
</head>
<body>
<div id="stage" aria-hidden="true">
  <canvas id="fx" width="720" height="1280"></canvas>
  <div id="david"><div id="flutter">
    <img id="pa" src="images/david-fly-a.png?v=2" alt="">
    <img id="pb" src="images/david-fly-b.png?v=2" alt="">
    <img id="pc" src="images/david-fly-c.png?v=2" alt="">
    <img id="pd" src="images/david-fly-d.png?v=2" alt="">
  </div></div>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var every = parseFloat(q.get('every')); if (!(every > 0)) every = 60;
  var FLY = 15; if (every < FLY + 1) every = FLY + 1;
  var left = (q.get('pos') || 'right').toLowerCase() === 'left';
  var test = q.get('test') === '1';
  var seek = parseFloat(q.get('t')); if (!(seek >= 0)) seek = 0;
  var SC = parseFloat(q.get('scale')); if (!(SC > 0.3 && SC < 2)) SC = 0.7;
  var firstDelay = test ? 1 : 4;
  if (q.get('dbg') === '1') document.body.classList.add('dbg');
  var M = left ? -1 : 1;                       // mirror whole layout for ?pos=left
  var W = 720, H = 1280;
  function mx(x) { return M === 1 ? x : W - x; }

  var david = document.getElementById('david'), flutter = document.getElementById('flutter');
  var imgs = { a: document.getElementById('pa'), b: document.getElementById('pb'), c: document.getElementById('pc'), d: document.getElementById('pd') };
  var cv = document.getElementById('fx'), ctx = cv.getContext('2d');

  /* ---- flight path: centre-of-body waypoints, one per second (uniform Catmull-Rom). Starts/ends at the hover spot. ---- */
  var REST = { x: 548, y: 1085 };
  var WP = [
    [548,1085],[545,1058],[470,930],[330,780],[190,590],[180,385],[310,215],[490,190],
    [595,330],[560,520],[400,700],[225,830],[160,985],[270,1112],[470,1092],[548,1085]
  ];
  function crp(a, b, c, d, u) {   // proper uniform Catmull-Rom
    var u2 = u * u, u3 = u2 * u;
    return 0.5 * ((2 * b) + (-a + c) * u + (2 * a - 5 * b + 4 * c - d) * u2 + (-a + 3 * b - 3 * c + d) * u3);
  }
  function pathAt(t) {            // t in seconds 0..FLY -> [x,y] screen coords (before mirroring)
    if (t <= 0) return WP[0];
    if (t >= FLY) return WP[WP.length - 1];
    var i = Math.floor(t), u = t - i, n = WP.length;
    var p0 = WP[Math.max(0, i - 1)], p1 = WP[i], p2 = WP[Math.min(n - 1, i + 1)], p3 = WP[Math.min(n - 1, i + 2)];
    return [crp(p0[0], p1[0], p2[0], p3[0], u), crp(p0[1], p1[1], p2[1], p3[1], u)];
  }

  /* ---- pose schedule (seconds into the flight) ---- */
  var SCHED = [[0,'b'],[0.9,'a'],[4.5,'b'],[7.0,'d'],[8.8,'a'],[10.4,'b'],[12.3,'a'],[13.2,'c'],[14.4,'b']];
  var SOMER_A = 7.3, SOMER_B = 8.7;

  /* ---- state ---- */
  var T = 0, acc = 0, last = 0;
  var cur = 'b', zc = 1, fadeT = 1, prevPose = null;
  var face = -1 * M, faceTarget = -1 * M;       // +1 faces right, -1 faces left; hover faces the screen centre
  var ang = 0, angVel = 0, angRaw = 0;
  var pos = { x: mx(REST.x), y: REST.y }, vel = { x: 0, y: 0 }, prevPos = null;
  var orb = { x: pos.x - 60 * M, y: pos.y - 200, a: 0, ph: 0 };
  var parts = [];
  var nextStart = firstDelay, lastTail = null;

  // sprites
  function sprite(r, stops) {
    var c = document.createElement('canvas'); c.width = c.height = r * 2;
    var g = c.getContext('2d'), gr = g.createRadialGradient(r, r, 0, r, r, r);
    for (var i = 0; i < stops.length; i++) gr.addColorStop(stops[i][0], stops[i][1]);
    g.fillStyle = gr; g.fillRect(0, 0, r * 2, r * 2); return c;
  }
  var spGold = sprite(32, [[0,'rgba(255,255,235,1)'],[0.25,'rgba(255,225,120,.85)'],[0.6,'rgba(255,190,70,.25)'],[1,'rgba(255,170,40,0)']]);
  var spGreen = sprite(32, [[0,'rgba(245,255,225,1)'],[0.25,'rgba(190,255,130,.85)'],[0.6,'rgba(120,230,90,.25)'],[1,'rgba(90,210,70,0)']]);
  var spWhite = sprite(32, [[0,'rgba(255,255,255,1)'],[0.3,'rgba(230,245,255,.7)'],[1,'rgba(200,230,255,0)']]);
  var spOrb = sprite(64, [[0,'rgba(255,255,255,1)'],[0.18,'rgba(255,250,200,.95)'],[0.45,'rgba(190,255,150,.45)'],[1,'rgba(120,230,100,0)']]);
  var sprites = [spGold, spGold, spGreen, spWhite];

  function poseFor(ft) {
    var p = SCHED[0][1];
    for (var i = 0; i < SCHED.length; i++) if (ft >= SCHED[i][0]) p = SCHED[i][1];
    return p;
  }
  function setPose(p) {
    if (p === cur) return;
    prevPose = cur; cur = p; zc++; fadeT = 0;
    imgs[p].style.zIndex = zc; imgs[p].style.opacity = 0;
  }
  function ease(x) { x = Math.max(0, Math.min(1, x)); return 0.5 - 0.5 * Math.cos(Math.PI * x); }
  function emit(x, y, vx, vy, n, big) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * 6.283, s = 10 + Math.random() * 38;
      parts.push({ x: x + (Math.random() - .5) * 30, y: y + (Math.random() - .5) * 30,
        vx: vx * 0.18 + Math.cos(a) * s, vy: vy * 0.18 + Math.sin(a) * s + 6,
        life: 0.7 + Math.random() * 1.1, age: 0,
        sz: (big ? 1.6 : 1) * (0.14 + Math.random() * 0.34),
        sp: sprites[(Math.random() * sprites.length) | 0], star: Math.random() < 0.18, tw: Math.random() * 6.283 });
    }
    if (parts.length > 700) parts.splice(0, parts.length - 700);
  }

  function step(dt) {
    T += dt;
    // flight scheduling
    var ft = -1;
    while (T - nextStart >= FLY) nextStart += every;
    if (T >= nextStart && T - nextStart < FLY) ft = T - nextStart;
    var flying = ft >= 0;

    // idle hover (always on, gentle)
    var idleY = Math.sin(T * 6.283 / 3.3) * 9 + Math.sin(T * 6.283 / 1.7) * 2.5;
    var idleX = Math.sin(T * 6.283 / 4.9) * 5;
    var idleR = Math.sin(T * 6.283 / 3.9) * 0.04;

    var bx, by;
    if (flying) { var p = pathAt(ft); bx = mx(p[0]); by = p[1]; }
    else { bx = mx(REST.x); by = REST.y; }
    var tx = bx + idleX, ty = by + idleY;
    if (prevPos) { vel.x = (tx - prevPos.x) / dt; vel.y = (ty - prevPos.y) / dt; }
    prevPos = { x: tx, y: ty };
    pos.x = tx; pos.y = ty;

    // facing: follow travel direction; hover faces the screen centre; quick card-flip turn
    var speed = Math.sqrt(vel.x * vel.x + vel.y * vel.y);
    if (flying) {
      if (vel.x > 40) faceTarget = 1; else if (vel.x < -40) faceTarget = -1;
      if (ft > 14.35) faceTarget = -1 * M;
    } else faceTarget = -1 * M;
    var df = faceTarget - face, mxs = 9 * dt;
    face += Math.abs(df) < mxs ? df : Math.sign(df) * mxs;

    // heading (nose follows velocity), bank into turns
    var want = 0;
    if (flying && speed > 25) {
      want = Math.atan2(vel.y, Math.abs(vel.x));
      want = Math.max(-0.9, Math.min(0.9, want)) * Math.min(1, speed / 150);
    }
    if (flying && ft > 13.9) want *= Math.max(0, 1 - (ft - 13.9) / 0.6);
    var prevAng = ang;
    ang += (want - ang) * Math.min(1, dt * 5.5);
    angVel += ((ang - prevAng) / dt - angVel) * Math.min(1, dt * 6);
    var bank = Math.max(-0.28, Math.min(0.28, angVel * 0.22));
    var roll = ang + bank + (flying ? 0 : idleR);
    var somer = 0;
    if (flying && ft > SOMER_A && ft < SOMER_B + 0.001) somer = 6.283185 * ease((ft - SOMER_A) / (SOMER_B - SOMER_A));
    else if (flying && ft >= SOMER_B) somer = 0;   // full turn completed = same orientation
    // somersault tumbles forward (clockwise when facing right) - apply in the facing frame
    var a = roll + somer;

    // pose swaps with crossfade
    setPose(flying ? poseFor(ft) : 'b');
    if (fadeT < 1) {
      fadeT = Math.min(1, fadeT + dt / 0.28);
      imgs[cur].style.opacity = ease(fadeT);
      if (fadeT >= 1) for (var k in imgs) if (k !== cur) imgs[k].style.opacity = 0;
    } else imgs[cur].style.opacity = 1;

    // secondary motion: body bob, legs/limbs flutter
    var amp = flying ? 1 : 0.35;
    var fl = (Math.sin(T * 11.5) * 2.2 + Math.sin(T * 7.1 + 1) * 1.4) * amp;
    var sk = Math.sin(T * 9.3) * 1.6 * amp;
    flutter.style.transformOrigin = '70% 45%';
    flutter.style.transform = 'rotate(' + fl.toFixed(2) + 'deg) skewX(' + sk.toFixed(2) + 'deg)';
    var bob = flying ? Math.sin(T * 6.283 * 1.6) * 7 : 0;
    david.style.transform = 'translate3d(' + pos.x.toFixed(1) + 'px,' + (pos.y + bob).toFixed(1) + 'px,0) scale(' + SC + ') scaleX(' + face.toFixed(3) + ') rotate(' + a.toFixed(4) + 'rad)';

    // sparkle trail from the legs end + Tinker Bell orb
    var hx = Math.cos(ang) * (face >= 0 ? 1 : -1), hy = Math.sin(ang);
    var tailX = pos.x - hx * 120 * SC / 0.62 * 0.5, tailY = pos.y + bob - hy * 120 * SC / 0.62 * 0.5;
    if (flying) {
      var n = Math.min(4, Math.round(speed / 70) + 1);
      for (var j = 0; j < n; j++) {
        var f = (j + 1) / n, ex = lastTail ? lastTail.x + (tailX - lastTail.x) * f : tailX, ey = lastTail ? lastTail.y + (tailY - lastTail.y) * f : tailY;
        emit(ex, ey, -vel.x * 0.3, -vel.y * 0.3, 1, false);
      }
      lastTail = { x: tailX, y: tailY };
    } else { lastTail = null; if (Math.random() < 0.05) emit(pos.x + (Math.random() - .5) * 120, pos.y + bob + 40, 0, 10, 1, false); }
    var oa = flying ? Math.min(1, Math.min(ft - 0.4, 14.6 - ft) / 0.6) : 0; oa = Math.max(0, oa);
    orb.a += (oa - orb.a) * Math.min(1, dt * 6);
    orb.ph += dt;
    var ox = pos.x - face * 150 + Math.cos(orb.ph * 3.1) * 38, oy = pos.y - 170 + Math.sin(orb.ph * 4.3) * 30;
    if (orb.a < 0.02) { orb.x = ox; orb.y = oy; }
    orb.x += (ox - orb.x) * Math.min(1, dt * 3.2); orb.y += (oy - orb.y) * Math.min(1, dt * 3.2);
    if (orb.a > 0.1 && Math.random() < 0.9) emit(orb.x, orb.y, 0, 10, 1, false);

    for (var i = parts.length - 1; i >= 0; i--) {
      var s = parts[i]; s.age += dt;
      if (s.age >= s.life) { parts.splice(i, 1); continue; }
      s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= (1 - 0.8 * dt); s.vy = s.vy * (1 - 0.8 * dt) + 10 * dt;
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < parts.length; i++) {
      var s = parts[i], t = 1 - s.age / s.life, al = t * t * (0.45 + 0.4 * Math.sin(T * 14 + s.tw));
      var r = 32 * s.sz * (0.5 + 0.7 * t);
      ctx.globalAlpha = Math.max(0, Math.min(1, al));
      ctx.drawImage(s.sp, s.x - r, s.y - r, r * 2, r * 2);
      if (s.star && t > 0.35) {
        ctx.globalAlpha = Math.max(0, Math.min(1, al * 0.9));
        ctx.fillStyle = '#fffbe0';
        var L = 9 * s.sz * 2.2, w = 1.1;
        ctx.fillRect(s.x - L, s.y - w, L * 2, w * 2); ctx.fillRect(s.x - w, s.y - L, w * 2, L * 2);
      }
    }
    if (orb.a > 0.01) {
      var pulse = 0.85 + 0.15 * Math.sin(T * 17);
      ctx.globalAlpha = orb.a;
      var R = 46 * pulse; ctx.drawImage(spOrb, orb.x - R, orb.y - R, R * 2, R * 2);
      ctx.globalAlpha = orb.a * 0.9; ctx.fillStyle = '#ffffff';
      var L2 = 16 * pulse; ctx.fillRect(orb.x - L2, orb.y - 1, L2 * 2, 2); ctx.fillRect(orb.x - 1, orb.y - L2, 2, L2 * 2);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }

  function frame(ts) {
    var dt = last ? Math.min(0.1, (ts - last) / 1000) : 1 / 60; last = ts;
    acc += dt;
    var guard = 0;
    while (acc >= 1 / 60 && guard++ < 8) { step(1 / 60); acc -= 1 / 60; }
    draw();
    requestAnimationFrame(frame);
  }

  function boot() {
    imgs.b.style.opacity = 1;
    if (seek > 0) { nextStart = 0.5; var n = Math.round((0.5 + seek) * 60); for (var i = 0; i < n; i++) step(1 / 60); }
    requestAnimationFrame(frame);
  }
  var pending = 4, started = false;
  function one() { if (--pending === 0 && !started) { started = true; boot(); } }
  for (var k in imgs) { if (imgs[k].complete) one(); else { imgs[k].addEventListener('load', one); imgs[k].addEventListener('error', one); } }
  setTimeout(function () { if (!started) { started = true; boot(); } }, 3000);
})();
</script>
</body>
</html>
