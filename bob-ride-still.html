<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Oasis Radio – Bob rides across the top (still image version)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<style>
  /* Palette & fonts taken from oasisradio.live (styles.css):
     spectrum #ff4d00 #ffc42e #ff2d8a #7a3dff #00d4ff #3dff9a
     primary #ff3d9a  cyan #2ad4ff  sun #ffc42e  ink #16141c
     Params: ?test=1 (ride now, then every 30s)  ?every=<min> (default 20)
             ?dur=<sec> crossing time (default 9)  ?flip=1 (ride left -> right)
             ?text=0 hide the catchphrase */
  :root { --ink:#16141c; --h:20vh; --dur:9s; }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:transparent !important; }

  /* the whole "train" (Bob + trailing catchphrase) slides across the top band */
  #ride { position:absolute; top:2vh; left:0; display:flex; align-items:center; gap:1.5vh;
    visibility:hidden; pointer-events:none; will-change:transform; transform:translateX(100vw); }
  #ride.go { visibility:visible; animation: rideL var(--dur) linear forwards; }
  body.flip #ride { flex-direction:row-reverse; transform:translateX(-100%); }
  body.flip #ride.go { animation-name: rideR; }
  @keyframes rideL { from { transform:translateX(100vw); } to { transform:translateX(-100%); } }
  @keyframes rideR { from { transform:translateX(-100%); } to { transform:translateX(100vw); } }

  /* Bob + bike: gentle road bounce and slight lean */
  .rider { position:relative; height:var(--h); flex:none; }
  .bike { height:100%; display:block; transform-origin:50% 95%;
    filter: drop-shadow(0 .6vh .5vh rgba(0,0,0,.45)) drop-shadow(0 0 1.2vh rgba(255,61,154,.35));
    animation: bounce .42s ease-in-out infinite, lean 2.6s ease-in-out infinite; }
  #ride:not(.go) .bike, #ride:not(.go) .puff { animation-play-state:paused; }
  @keyframes bounce { 0%,100% { translate:0 0; } 50% { translate:0 -.6vh; } }
  @keyframes lean   { 0%,100% { rotate:-2deg; } 50% { rotate:1deg; } }
  body.flip .bike { animation: bounce .42s ease-in-out infinite, leanR 2.6s ease-in-out infinite; }
  @keyframes leanR  { 0%,100% { rotate:2deg; } 50% { rotate:-1deg; } }

  /* exhaust puffs (pipe tip) + dust (rear tyre), blow out behind the bike */
  .fx { position:absolute; width:0; height:0; }
  .fx.exhaust { left:97%; top:71%; }
  .fx.dust    { left:80%; top:93%; }
  body.flip .fx.exhaust { left:3%; }
  body.flip .fx.dust    { left:20%; }
  .puff { position:absolute; left:0; top:0; width:2.2vh; height:2.2vh; margin:-1.1vh; border-radius:50%;
    background: radial-gradient(circle at 40% 40%, rgba(255,255,255,.85), rgba(220,220,235,.45) 55%, rgba(200,200,220,0) 72%);
    opacity:0; animation: puff 1.1s ease-out infinite; }
  .dust .puff { background: radial-gradient(circle, rgba(255,196,46,.55), rgba(255,140,60,.25) 55%, rgba(255,140,60,0) 72%);
    animation-name: dust; animation-duration:.9s; }
  .puff:nth-child(2) { animation-delay:.28s; } .puff:nth-child(3) { animation-delay:.55s; } .puff:nth-child(4) { animation-delay:.82s; }
  @keyframes puff { 0% { opacity:.9; transform:translate(0,0) scale(.4); }
                    100% { opacity:0; transform:translate(var(--dx,7vh),-2.5vh) scale(2.4); } }
  @keyframes dust { 0% { opacity:.8; transform:translate(0,0) scale(.5); }
                    100% { opacity:0; transform:translate(var(--dx,6vh),-1vh) scale(2); } }
  body.flip .puff { --dx:-7vh; } body.flip .dust .puff { --dx:-6vh; }

  /* trailing catchphrase in the site's 80s spectrum style */
  .say { flex:none; font-family:'Bungee', Impact, sans-serif; font-size:3.2vh; line-height:1.15; text-align:left;
    white-space:nowrap; letter-spacing:-.05vh; margin-top:3vh;
    background-image: linear-gradient(100deg,#ff4d00 0%,#ffc42e 18%,#ff2d8a 42%,#7a3dff 64%,#00d4ff 84%,#3dff9a 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke: .16vh #fff;
    filter: drop-shadow(0 .3vh 0 #7a3dff) drop-shadow(0 .25vh 0 var(--ink)) drop-shadow(0 0 1vh rgba(255,61,154,.6)); }
  body.flip .say { text-align:right; }
  body.notext .say { display:none; }
</style>
</head>
<body>
<div id="ride" aria-hidden="true">
  <div class="rider">
    <img class="bike" id="bike" src="images/bob-ride.png" alt="">
    <div class="fx exhaust"><span class="puff"></span><span class="puff"></span><span class="puff"></span><span class="puff"></span></div>
    <div class="fx dust"><span class="puff"></span><span class="puff"></span><span class="puff"></span></div>
  </div>
  <div class="say">From the desert<br>to your dashboard!</div>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var test  = q.get('test') === '1';
  var flip  = q.get('flip') === '1';
  var every = parseFloat(q.get('every')); if (!(every > 0)) every = 20;     // minutes
  var dur   = parseFloat(q.get('dur'));   if (!(dur > 0))   dur = 9;        // seconds per crossing
  var firstDelay = test ? 0 : 30;                                            // seconds
  var periodMs = test ? 30000 : every * 60000;
  if (flip) { document.body.classList.add('flip'); document.getElementById('bike').src = 'images/bob-ride-right.png'; }
  if (q.get('text') === '0') document.body.classList.add('notext');
  document.documentElement.style.setProperty('--dur', dur + 's');
  var el = document.getElementById('ride');
  el.addEventListener('animationend', function(e){ if (e.target === el) el.classList.remove('go'); });
  function ride(){ el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); }
  setTimeout(function(){ ride(); setInterval(ride, periodMs); }, firstDelay * 1000);
})();
</script>
</body>
</html>
