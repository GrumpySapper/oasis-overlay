     Old versions: marble-race-classic.html (3D view of the vertical course), marble-race-2d.html (flat 2D).
     ?test=1  runs races with 12 pretend names (no server).   ?theme=halloween | ?theme=80s  (default: Halloween until end of Sun 1 Nov 2026 UK, then 80s)

      glowText(ctx, 'Send a 100+ 💎 gift', 360, 500, 40, T.accent3);
      glowText(ctx, 'when entries open to join!', 360, 552, 28, '#fff', T.accent2);
      champsPanel(650);
    } else if (mode === 'entries') {
      const n = race.marbles.length;
      panel(40, 600, 640, 250, T.accent);
      glowText(ctx, 'ENTRIES OPEN!', 360, 650, 50, T.accent3, T.accent);
      glowText(ctx, 'Send a 100+ 💎 gift to join!', 360, 715, fit(ctx, 'Send a 100+ 💎 gift to join!', 600, 38), '#fff', T.accent2);
      glowText(ctx, `${n} marble${n === 1 ? '' : 's'} on the line`, 360, 770, 30, T.accent2);
      if (auto.on) { const left = Math.max(0, auto.minutes * 60000 - (Date.now() - openedAtLocal)); const s = Math.ceil(left / 1000); glowText(ctx, n >= 2 ? (left > 0 ? `Race starts in ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : 'Starting any second…') : 'Needs 2+ marbles to start', 360, 820, 26, T.accent3); }
      else glowText(ctx, 'One marble each • extra gifts = cheers', 360, 820, 22, '#fff');
      champsPanel(880);
    } else if (mode === 'countdown') {
      const s = Math.ceil((startAtLocal - Date.now()) / 1000); const frac = ((startAtLocal - Date.now()) % 1000) / 1000;
      if (s >= 1 && s <= 3) glowText(ctx, String(s), 360, 700, Math.round(190 + 80 * frac), T.accent3, T.accent);
      else if (s > 3) glowText(ctx, 'GET READY!', 360, 700, 80, T.accent3, T.accent);
    } else if (mode === 'racing') {
      const tt = race.t / 1000; glowText(ctx, `⏱ ${tt.toFixed(1)}s`, 24, 128, 26, '#fff', T.accent2, 'left');
      const st = race.standings().slice(0, 5); panel(440, 108, 268, 34 + st.length * 34, T.accent2);
      st.forEach((m, i) => { drawMarble(ctx, m, 470, 140 + i * 34, 12, m.idx, 0); ctx.font = `800 21px ${UI}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; const tx = `${i + 1}. ${m.name.length > 12 ? m.name.slice(0, 11) + '…' : m.name}`; ctx.lineJoin = 'round'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.9)'; ctx.strokeText(tx, 492, 141 + i * 34); ctx.fillStyle = i === 0 ? T.accent3 : '#fff'; ctx.fillText(tx, 492, 141 + i * 34); });
      drawProgress(st[0]);
      if (tt < 2) glowText(ctx, 'GO!', 360, 640, 200, T.accent3, T.accent);
    } else if (mode === 'inprogress' || mode === 'over') {
      panel(90, 480, 540, 150, T.accent); glowText(ctx, mode === 'over' ? 'Race over!' : 'Race in progress…', 360, 535, 40, '#fff', T.accent); glowText(ctx, 'Results coming up!', 360, 590, 28, T.accent3);
    } else if (mode === 'finished') drawPodium(now);
    toasts = toasts.filter(t => now - t.t < 3500);
    toasts.forEach((t, i) => { const a = Math.min(1, (3500 - (now - t.t)) / 500); ctx.save(); ctx.globalAlpha = a; const y = 1200 - (toasts.length - 1 - i) * 54; ctx.font = `800 24px ${UI}`; const w = Math.min(680, ctx.measureText(t.s).width + 40); ctx.fillStyle = 'rgba(0,0,0,.7)'; rr(ctx, 360 - w / 2, y - 22, w, 44, 22); ctx.fill(); ctx.strokeStyle = t.col; ctx.lineWidth = 3; ctx.stroke(); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t.s, 360, y, 640); ctx.restore(); });
  }
  // track progress strip: every marble as a dot from START to the flag, leader with their picture
  function drawProgress(lead) {
    const x0 = 34, x1 = 404, y = 172; ctx.save(); ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    const gr = ctx.createLinearGradient(x0, 0, x1, 0); gr.addColorStop(0, T.accent2); gr.addColorStop(1, T.accent); ctx.strokeStyle = gr; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    for (const f of TR.feats) { if (f.key === 'start' || f.key === 'runoff') continue; const x = x0 + (x1 - x0) * Math.min(1, f.s0 / TR.finishS); ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(x - 1, y - 7, 2, 14); }
    ctx.font = '18px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🏁', x1 + 16, y);
    const list = race.marbles.slice().sort((a, b) => a.s - b.s);
    for (const m of list) { if (m === lead) continue; const x = x0 + (x1 - x0) * Math.max(0, Math.min(1, m.s / TR.finishS)); ctx.fillStyle = m.color || '#fff'; ctx.strokeStyle = 'rgba(0,0,0,.8)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 5.5, 0, 7); ctx.fill(); ctx.stroke(); }
    if (lead) { const x = x0 + (x1 - x0) * Math.max(0, Math.min(1, lead.s / TR.finishS)); drawMarble(ctx, lead, x, y, 12, lead.idx, 0); }
    ctx.restore();
  }
  function drawPodium(now) {
    const list = (official || results || []); const byId = new Map(race.marbles.map(m => [m.id, m]));
    const top = list.slice(0, 3).map(r => byId.get(r.id) || { id: r.id, name: r.name, color: '#fff', idx: 0 });
    const k = Math.min(1, (now - finishedAtLocal - 900) / 600);
    if (k <= 0) { glowText(ctx, '🏁 FINISHED! 🏁', 360, 560, 70, T.accent3, T.accent); return; }
    if (top[0]) { const s = `WINNER: ${top[0].name}`; glowText(ctx, '🏁 🏁 🏁', 360, 170, 44, '#fff'); glowText(ctx, s, 360, 240, Math.round(fit(ctx, s, 660, 60) * (0.6 + .4 * k)), T.accent3, T.accent); glowText(ctx, 'Bragging rights for the night! 😎', 360, 300, 26, '#fff', T.accent2); }
    // names above the 3D podium marbles
    podMeshes.forEach(g => { if (!g.visible) return; const m = g.userData.m, p = podium[g.userData.i]; finale.localToWorld(_w.set(g.position.x, g.position.y + 60, g.position.z)); const s = toScreen(_w.x, _w.y, _w.z); const nm = m.name; glowText(ctx, nm, s.x, s.y - 14, fit(ctx, nm, 210, 28), '#fff', p.col); });
    champsPanel(960);
    for (const c of confetti) { c.vy += .35; c.x += c.vx; c.y += c.vy; c.r += .2; c.life++; ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r); ctx.fillStyle = c.c; ctx.fillRect(-5, -3, 10, 6); ctx.restore(); }
    confetti = confetti.filter(c => c.y < VH + 20 && c.life < 300);
  }

  // ---------- live data (same stable box link as gift-jar.html) ----------
  const BOX = 'https://approach-grandkid-sermon.ngrok-free.dev', H_ = { 'ngrok-skip-browser-warning': '1' };
  // ---------- test mode: 12 pretend names, endless races ----------
  const FAKE = ['Neon Nina', 'Cassette Kev', 'Rubik Rita', 'Walkman Wayne', 'Synth Sue', 'Arcade Andy', 'Mixtape Mia', 'Boombox Barry', 'Leg-Warmer Liz', 'Pac-Man Pete', 'Big Hair Brenda', 'Atari Annie'];
  const COLORS = ['#ff2bd6', '#00f0ff', '#ffe600', '#a74bff', '#39ff14', '#ff7a00', '#ff3860', '#3d7bff', '#ffffff', '#00ffa8', '#ff9cf0', '#c6ff00'];
  let testSt = null, testChamps = {};
  function testState(phase, extra) { testSt = Object.assign({ now: Date.now(), phase, champs: Object.entries(testChamps).map(([id, c]) => ({ id, name: c.name, wins: c.wins })).sort((a, b) => b.wins - a.wins), auto: { on: false, minutes: 3 } }, testSt && { marbles: testSt.marbles, raceId: testSt.raceId, seed: testSt.seed, startAt: testSt.startAt, openedAt: testSt.openedAt }, extra || {}); return testSt; }
  function testLoop() {
    const n = +(q.get('n') || 12);
    testSt = null; applyState(testState('entries', { marbles: [], openedAt: Date.now() }), 'open');
    let i = 0; const iv = setInterval(() => { if (i >= Math.min(n, FAKE.length * 3)) { clearInterval(iv); setTimeout(() => applyState(testState('countdown', { raceId: 'test' + Date.now(), seed: (Math.random() * 1e9) | 0, startAt: Date.now() + 4000 }), 'start'), 1200); return; }
      const nm = FAKE[i % FAKE.length] + (i >= FAKE.length ? ' ' + (1 + Math.floor(i / FAKE.length)) : ''), m = { id: 't' + i, name: nm, color: COLORS[i % COLORS.length], avatar: i % 4 === 3 ? null : placeholderAvatar(nm, COLORS[i % COLORS.length], i) }; i++;
      const st = testState('entries', { marbles: (testSt.marbles || []).concat(m) }); applyState(st, 'join', { marble: m });
      if (i === 5) applyState(st, 'cheer', { name: FAKE[1] });
    }, +(q.get('joinms') || 350));
  }
  function testFinish(order) {
    const w = race.marbles.find(m => m.id === order[0]); const c = testChamps[w.id] || { name: w.name, wins: 0 }; c.wins++; testChamps[w.id] = c;
    const st = testState('finished', { results: order.map((id, i) => ({ place: i + 1, id, name: race.marbles.find(m => m.id === id).name })) }); applyState(st, 'result');
    setTimeout(testLoop, +(q.get('pause') || 15000));
  }
  if (TEST) { testLoop(); requestAnimationFrame(frame); return; }

  const PATH = q.get('channel') === 'test' ? '/events?channel=test' : '/events';
  fetch(BOX + '/api/marble/state', { headers: H_, cache: 'no-store' }).then(r => r.json()).then(st => applyState(st, 'init')).catch(() => {});
  let ctrl = null, lastData = Date.now(), running = false;
  async function run() {
    if (running) return; running = true; lastData = Date.now(); ctrl = new AbortController();
    try {
      const r = await fetch(BOX + PATH, { headers: Object.assign({ Accept: 'text/event-stream' }, H_), cache: 'no-store', signal: ctrl.signal });
      if (!r.ok || !r.body) throw new Error('status ' + r.status);
      fetch(BOX + '/api/marble/state', { headers: H_, cache: 'no-store' }).then(r => r.json()).then(st => applyState(st, 'init')).catch(() => {});
      const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '';
      for (;;) {
        const { value, done } = await rd.read(); if (done) break;
        lastData = Date.now(); buf += dec.decode(value, { stream: true }).replace(/\r/g, '');
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
          const data = chunk.split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).replace(/^ /, '')).join('\n');
          if (data) { try { const d = JSON.parse(data); if (d && d.type === 'marble') { if (d.ev === 'cheer') toast(`📣 ${d.name || 'Someone'} cheers their marble on!`, T.accent2); else applyState(d.state, d.ev, d); } } catch (e) {} }
        }
      }
    } catch (e) {}
    try { ctrl.abort(); } catch (e) {}
    running = false; setTimeout(run, 3000);
  }
  setInterval(() => { if (running && Date.now() - lastData > 45000) { try { ctrl.abort(); } catch (e) {} } }, 10000);
  run();
  requestAnimationFrame(frame);

})();
</script>
