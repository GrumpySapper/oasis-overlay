<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Oasis Radio promo banner</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Oswald:wght@700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
<style>
  /* Palette & fonts taken from oasisradio.live (styles.css):
     spectrum #ff4d00 #ffc42e #ff2d8a #7a3dff #00d4ff #3dff9a
     primary #ff3d9a  cyan #2ad4ff  sun #ffc42e  palm #2ee56a  ink #16141c
     fonts: Bungee (display), Oswald 700 (logo-spectrum), Outfit (body) */
  :root { --pink:#ff3d9a; --cyan:#2ad4ff; --sun:#ffc42e; --palm:#2ee56a; --ink:#16141c; --violet:#7a3dff; }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:transparent !important; }
  #promo { position:absolute; left:0; right:0; bottom:20vh; text-align:center; pointer-events:none;
    opacity:0; border:none; outline:none; background:none; }
  #promo.show { animation: inbounce 1.1s cubic-bezier(.2,1.5,.4,1) forwards; }
  #promo.hide { animation: outzoom .8s ease-in forwards; }
  @keyframes inbounce {
    0%   { opacity:0; transform: translateY(40vh) scale(.4) rotate(-8deg); }
    55%  { opacity:1; transform: translateY(-3vh) scale(1.12) rotate(3deg); }
    78%  { transform: translateY(1vh) scale(.96) rotate(-1deg); }
    100% { opacity:1; transform: none; }
  }
  @keyframes outzoom {
    0%   { opacity:1; transform:none; }
    35%  { transform: scale(1.1) rotate(-2deg); }
    100% { opacity:0; transform: translateX(110vw) rotate(12deg) scale(.7); }
  }
  .logo { width:44vw; display:block; margin:0 auto -1.5vw;
    filter: drop-shadow(0 .5vw 0 rgba(22,20,28,.55)) drop-shadow(0 0 2vw rgba(255,61,154,.45));
    animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-1vh) rotate(1.5deg); } }
  /* Chunky 3D spectrum wordmark, like the site's logo-spectrum + OASIS logo extrusion */
  .site { font-family:'Bungee', 'Outfit', Impact, sans-serif; font-size:8.6vw; line-height:1.1; white-space:nowrap;
    letter-spacing:-.1vw;
    background-image: linear-gradient(100deg,#ff4d00 0%,#ffc42e 18%,#ff2d8a 42%,#7a3dff 64%,#00d4ff 84%,#3dff9a 100%,#ff4d00 118%);
    background-size: 200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke: .32vw #fff;
    filter: drop-shadow(0 .45vw 0 #7a3dff) drop-shadow(0 .45vw 0 #3a1470) drop-shadow(0 .3vw 0 var(--ink)) drop-shadow(0 0 1.6vw rgba(255,61,154,.7));
    animation: shimmer 4s ease-in-out infinite alternate; }
  @keyframes shimmer { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
  .live { display:inline-block; margin-top:1.4vw; font-family:'Bungee', Impact, sans-serif; font-size:10vw; line-height:1;
    color: var(--sun); -webkit-text-stroke: .35vw var(--ink); paint-order: stroke fill;
    text-shadow: .5vw .5vw 0 var(--pink), 1vw 1vw 0 var(--violet), 0 0 3vw rgba(255,196,46,.6);
    animation: pulse 1.1s ease-in-out infinite; }
  .live .d { color:#ff2d6a; text-shadow: 0 0 1.5vw #ff2d6a, 0 0 3vw #ff2d6a; -webkit-text-stroke:0; animation: blink 1s steps(2) infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1) rotate(-2deg); } 50% { transform: scale(1.07) rotate(-2deg); } }
  @keyframes blink { 50% { opacity:.2; } }
  .tag { margin-top:1.6vw; font-family:'Outfit', sans-serif; font-weight:900; font-size:4.6vw; letter-spacing:.1vw;
    color: var(--cyan); -webkit-text-stroke: .25vw var(--ink); paint-order: stroke fill;
    text-shadow: .35vw .35vw 0 var(--ink), 0 0 2vw rgba(42,212,255,.6); }
  .tag b { color: var(--pink); }
  .burst { position:absolute; width:2.2vw; height:9vw; border-radius:1vw; opacity:0; animation: zap 1.4s ease-out infinite; }
  @keyframes zap { 0% { opacity:0; transform: var(--r) scaleY(.2); } 30% { opacity:1; transform: var(--r) scaleY(1.1); } 100% { opacity:0; transform: var(--r) scaleY(.6) translateY(-3vw); } }
</style>
</head>
<body>
<div id="promo" aria-hidden="true">
  <img class="logo" src="images/oasis-logo.png" alt="">
  <div class="site">OASISRADIO.LIVE</div>
  <div class="live"><span class="d">●</span> LIVE 24/7 <span class="d">●</span></div>
  <div class="tag">No Mirage, <b>Just Pure Hits.</b></div>
  <!-- comic "burst" slashes like the site's tagline art -->
  <span class="burst" style="left:7%;top:30%;background:var(--sun);--r:rotate(-55deg);animation-delay:0s"></span>
  <span class="burst" style="left:4%;top:48%;background:var(--pink);--r:rotate(-80deg);animation-delay:.35s"></span>
  <span class="burst" style="left:9%;top:64%;background:var(--cyan);--r:rotate(-110deg);animation-delay:.7s"></span>
  <span class="burst" style="right:7%;top:30%;background:var(--cyan);--r:rotate(55deg);animation-delay:.2s"></span>
  <span class="burst" style="right:4%;top:48%;background:var(--sun);--r:rotate(80deg);animation-delay:.55s"></span>
  <span class="burst" style="right:9%;top:64%;background:var(--pink);--r:rotate(110deg);animation-delay:.9s"></span>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var test = q.get('test') === '1';
  var every = parseFloat(q.get('every')); if (!(every > 0)) every = 20;     // minutes
  var dur   = parseFloat(q.get('dur'));   if (!(dur > 0))   dur = 20;       // seconds
  var firstDelay = test ? 0 : 60;                                            // seconds
  var periodMs = test ? 30000 : every * 60000;
  var el = document.getElementById('promo');
  var hideT;
  function show(){
    clearTimeout(hideT);
    el.classList.remove('hide'); void el.offsetWidth; el.classList.add('show');
    hideT = setTimeout(function(){ el.classList.remove('show'); el.classList.add('hide'); }, dur * 1000);
  }
  setTimeout(function(){ show(); setInterval(show, periodMs); }, firstDelay * 1000);
})();
</script>
</body>
</html>
