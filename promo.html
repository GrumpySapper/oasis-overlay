<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Oasis Radio promo banner</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Bungee&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background: transparent !important; }
  /* Borderless band: lower-middle, ~20% up from the bottom */
  #promo { position:absolute; left:0; right:0; bottom:20vh; text-align:center;
    pointer-events:none; opacity:0; transform: translateX(-120vw) skewX(-12deg);
    border:none; outline:none; background:none; }
  #promo.show { animation: inbounce 1.1s cubic-bezier(.2,1.4,.4,1) forwards; }
  #promo.hide { animation: outzoom .9s ease-in forwards; }
  @keyframes inbounce {
    0%   { opacity:0; transform: translateX(-120vw) skewX(-12deg); }
    60%  { opacity:1; transform: translateX(4vw) skewX(6deg); }
    80%  { transform: translateX(-1.5vw) skewX(-2deg); }
    100% { opacity:1; transform: translateX(0) skewX(0); }
  }
  @keyframes outzoom {
    0%   { opacity:1; transform: translateX(0) scale(1); }
    30%  { transform: translateX(-3vw) scale(1.05); }
    100% { opacity:0; transform: translateX(120vw) skewX(-14deg) scale(.9); }
  }
  .top { font-family:'Bungee', Impact, sans-serif; font-size:5.2vw; letter-spacing:.6vw;
    color:#fff; text-shadow: 0 0 1vw #ff2fd0, 0 0 2.4vw #ff2fd0, 0 .4vw .6vw rgba(0,0,0,.8); }
  .site { font-family:'Monoton', 'Bungee', Impact, sans-serif; font-size:6.4vw; line-height:1.3;
    margin:.6vh 0; white-space:nowrap;
    background: linear-gradient(100deg,#ffe259 0%,#ff7a00 18%,#ff2fd0 36%,#7a5cff 52%,#00e5ff 68%,#ffe259 86%,#ff7a00 100%);
    background-size: 250% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    filter: drop-shadow(0 0 .8vw rgba(255,47,208,.9)) drop-shadow(0 0 2vw rgba(255,140,0,.7)) drop-shadow(0 .4vw .5vw rgba(0,0,0,.9));
    animation: shimmer 3s linear infinite; }
  @keyframes shimmer { from { background-position: 0% 50%; } to { background-position: 250% 50%; } }
  .live { display:inline-block; font-family:'Bungee', Impact, sans-serif; font-size:8vw; color:#fff;
    letter-spacing:.5vw;
    text-shadow: 0 0 .8vw #00e5ff, 0 0 2vw #00e5ff, 0 0 4vw #7a5cff, 0 .4vw .6vw rgba(0,0,0,.9);
    animation: pulse 1.2s ease-in-out infinite; }
  .dot { color:#ff2b2b; text-shadow: 0 0 1vw #ff2b2b, 0 0 2.5vw #ff2b2b; animation: blink 1s steps(2) infinite; }
  @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
  @keyframes blink { 50% { opacity:.25; } }
  .tag { font-family:'Bungee', Impact, sans-serif; font-size:4.4vw; color:#ffe259; margin-top:.8vh;
    text-shadow: 0 0 1vw #ff7a00, 0 .3vw .5vw rgba(0,0,0,.9); }
  .emoji { font-size:7vw; vertical-align:middle; display:inline-block; animation: sway 2s ease-in-out infinite; }
  .emoji.r { animation-delay: -1s; }
  @keyframes sway { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg) translateY(-.6vh); } }
  .spark { position:absolute; font-size:5vw; opacity:0; animation: twinkle 1.8s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity:0; transform:scale(.3) rotate(0); } 50% { opacity:1; transform:scale(1.2) rotate(90deg); } }
</style>
</head>
<body>
<div id="promo" aria-hidden="true">
  <div class="top"><span class="emoji">🌴</span> OASIS RADIO <span class="emoji r">🌅</span></div>
  <div class="site">oasisradio.live</div>
  <div class="live"><span class="dot">●</span> LIVE 24/7 <span class="dot">●</span></div>
  <div class="tag">📻 Tune in anytime 📻</div>
  <span class="spark" style="left:6%;top:-4%;animation-delay:0s">✨</span>
  <span class="spark" style="right:7%;top:8%;animation-delay:.6s">✨</span>
  <span class="spark" style="left:12%;bottom:4%;animation-delay:1.1s">⭐</span>
  <span class="spark" style="right:14%;bottom:-2%;animation-delay:.3s">✨</span>
  <span class="spark" style="left:46%;top:-10%;animation-delay:1.4s">💫</span>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var test = q.get('test') === '1';
  var every = parseFloat(q.get('every')); if (!(every > 0)) every = 20;     // minutes
  var dur   = parseFloat(q.get('dur'));   if (!(dur > 0))   dur = 20;       // seconds
  var firstDelay = test ? 0 : 60;                                            // seconds
  var periodMs = test ? 30000 : every * 60000;
  var el = document.getElementById('promo');
  var hideT;
  function show(){
    clearTimeout(hideT);
    el.classList.remove('hide'); void el.offsetWidth; el.classList.add('show');
    hideT = setTimeout(function(){ el.classList.remove('show'); el.classList.add('hide'); }, dur * 1000);
  }
  setTimeout(function(){ show(); setInterval(show, periodMs); }, firstDelay * 1000);
})();
</script>
</body>
</html>
