    for (const d of race.doors) { ctx.save(); ctx.strokeStyle = T.door; ctx.shadowColor = T.door; ctx.shadowBlur = 14; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.beginPath(); if (d.open) { ctx.moveTo(d.x1, d.y1); ctx.lineTo(d.x1 + 6, d.y1 + (d.x2 - d.x1) * .9); ctx.moveTo(d.x2, d.y2); ctx.lineTo(d.x2 - 6, d.y2 + 30); } else { ctx.moveTo(d.x1, d.y1); ctx.lineTo(d.x2, d.y2); } ctx.stroke(); ctx.restore(); }
    for (const s of race.spinners) { const b = s.body; if (Math.abs(b.position.y - camY - VH / 2) > VH) continue; ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle); ctx.fillStyle = T.spin; ctx.shadowColor = T.spin; ctx.shadowBlur = 18; rr(ctx, -s.len / 2, -7, s.len, 14, 7); ctx.fill(); ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, 7); ctx.fill(); ctx.restore(); }
    for (const o of race.statics) { if (o.kind !== 'bumper' || Math.abs(o.y - camY - VH / 2) > VH) continue; const b = o.body; if (b.plugin.hit) { bumperHit.set(b.id, now); b.plugin.hit = 0; } const k = Math.max(0, 1 - (now - (bumperHit.get(b.id) || 0)) / 250); const r = o.r * (1 + k * .15);
      if (HW) { ctx.save(); if (k) { ctx.shadowColor = '#ffb000'; ctx.shadowBlur = 30 * k; } pumpkin(ctx, o.x, o.y, r, true); ctx.restore(); }
      else { ctx.save(); ctx.fillStyle = k ? '#fff' : '#3a0030'; ctx.strokeStyle = T.bumper; ctx.lineWidth = 6; ctx.shadowColor = T.bumper; ctx.shadowBlur = 16 + 20 * k; ctx.beginPath(); ctx.arc(o.x, o.y, r, 0, 7); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0; ctx.fillStyle = T.accent3; ctx.font = `${r}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('★', o.x, o.y + 1); ctx.restore(); } }
    // marbles
    const many = race.marbles.length > 16;
    const lead = mode === 'racing' ? race.leader() : null;
    for (const m of race.marbles) { const p = m.body.position; if (p.y < camY - 60 || p.y > camY + VH + 60) continue; drawMarble(ctx, m, p.x, p.y, race.R, m.idx, (mode === 'entries' || mode === 'countdown' ? race.marbles.length <= 8 : mode !== 'finished' && (!many || m === lead || (m.place && m.place <= 3))) ? (many ? 12 : 14) : 0); }
    if (lead) { const p = lead.body.position; ctx.fillStyle = T.accent3; ctx.font = '22px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('👑', p.x, p.y - race.R - 26); }
    ctx.restore();
    drawHud(now);
  }

  function panel(x, y, w, h, col) { ctx.save(); ctx.fillStyle = T.panel; ctx.strokeStyle = col || T.accent; ctx.lineWidth = 4; ctx.shadowColor = col || T.accent; ctx.shadowBlur = 18; rr(ctx, x, y, w, h, 18); ctx.fill(); ctx.stroke(); ctx.restore(); }
  function champsPanel(y) {
    if (!champs.length) return;
    const rows = champs.slice(0, 5); const h = 66 + rows.length * 38; panel(110, y, 500, h, T.accent2);
    glowText(ctx, HW ? '🏆 MARBLE CHAMPS 🦇' : '🏆 MARBLE CHAMPS', 360, y + 32, 30, T.accent2);
    rows.forEach((c, i) => { ctx.font = `bold 24px system-ui,sans-serif`; ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(`${i + 1}. ${c.name.length > 18 ? c.name.slice(0, 17) + '…' : c.name}`, 140, y + 74 + i * 38); ctx.textAlign = 'right'; ctx.fillStyle = T.accent3; ctx.fillText(`${c.wins} win${c.wins === 1 ? '' : 's'}`, 580, y + 74 + i * 38); });
  }
  function drawHud(now) {
    // title bar
    const pulse = 1 + Math.sin(now / 400) * .03;
    ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, VW, 92); ctx.restore();
    glowText(ctx, T.title, 360, 38, Math.round(fit(ctx, T.title, 660, 44) * pulse), T.accent3, T.accent);
    glowText(ctx, T.sub, 360, 78, 20, T.accent2);
    if (mode === 'idle' || !race) {
      panel(70, 380, 580, 220, T.accent);
      glowText(ctx, HW ? 'The spooky race is coming!' : 'The race is coming!', 360, 440, 34, '#fff', T.accent);
      glowText(ctx, 'Send a 100+ 💎 gift', 360, 500, 40, T.accent3);
      glowText(ctx, 'when entries open to join!', 360, 552, 28, '#fff', T.accent2);
      champsPanel(650);
    } else if (mode === 'entries') {
      const n = race.marbles.length;
      panel(40, 470, 640, 250, T.accent);
      glowText(ctx, 'ENTRIES OPEN!', 360, 520, 50, T.accent3, T.accent);
      glowText(ctx, 'Send a 100+ 💎 gift to join!', 360, 585, fit(ctx, 'Send a 100+ 💎 gift to join!', 600, 38), '#fff', T.accent2);
      glowText(ctx, `${n} marble${n === 1 ? '' : 's'} on the line`, 360, 640, 30, T.accent2);
      if (auto.on) { const left = Math.max(0, auto.minutes * 60000 - (Date.now() - openedAtLocal)); const s = Math.ceil(left / 1000); glowText(ctx, n >= 2 ? (left > 0 ? `Race starts in ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : 'Starting any second…') : 'Needs 2+ marbles to start', 360, 690, 26, T.accent3); }
      else glowText(ctx, 'One marble each • extra gifts = cheers', 360, 690, 22, '#fff');
      champsPanel(760);
    } else if (mode === 'countdown') {
      const s = Math.ceil((startAtLocal - Date.now()) / 1000); const frac = ((startAtLocal - Date.now()) % 1000) / 1000;
      if (s >= 1 && s <= 3) glowText(ctx, String(s), 360, 560, Math.round(190 + 80 * frac), T.accent3, T.accent);
      else if (s > 3) glowText(ctx, 'GET READY!', 360, 560, 80, T.accent3, T.accent);
    } else if (mode === 'racing') {
      const tt = race.t / 1000; glowText(ctx, `⏱ ${tt.toFixed(1)}s`, 24, 128, 26, '#fff', T.accent2, 'left');
      const st = race.standings().slice(0, 5); panel(440, 108, 268, 34 + st.length * 34, T.accent2);
      st.forEach((m, i) => { drawMarble(ctx, m, 470, 140 + i * 34, 12, m.idx, 0); ctx.font = 'bold 20px system-ui,sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = i === 0 ? T.accent3 : '#fff'; ctx.fillText(`${i + 1}. ${m.name.length > 13 ? m.name.slice(0, 12) + '…' : m.name}`, 492, 141 + i * 34); });
      if (tt < 2) glowText(ctx, 'GO!', 360, 560, 200, T.accent3, T.accent);
    } else if (mode === 'inprogress' || mode === 'over') {
      panel(90, 480, 540, 150, T.accent); glowText(ctx, mode === 'over' ? 'Race over!' : 'Race in progress…', 360, 535, 40, '#fff', T.accent); glowText(ctx, 'Results coming up!', 360, 590, 28, T.accent3);
    } else if (mode === 'finished') drawPodium(now);
    // toasts
    toasts = toasts.filter(t => now - t.t < 3500);
    toasts.forEach((t, i) => { const a = Math.min(1, (3500 - (now - t.t)) / 500); ctx.save(); ctx.globalAlpha = a; const y = 1200 - (toasts.length - 1 - i) * 54; ctx.font = `bold 24px system-ui,sans-serif`; const w = Math.min(680, ctx.measureText(t.s).width + 40); ctx.fillStyle = 'rgba(0,0,0,.7)'; rr(ctx, 360 - w / 2, y - 22, w, 44, 22); ctx.fill(); ctx.strokeStyle = t.col; ctx.lineWidth = 3; ctx.stroke(); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t.s, 360, y, 640); ctx.restore(); });
  }
  function drawPodium(now) {
    const list = (official || results || []); const byId = new Map(race.marbles.map(m => [m.id, m]));
    const top = list.slice(0, 3).map(r => byId.get(r.id) || { id: r.id, name: r.name, color: '#fff', idx: 0 });
    const k = Math.min(1, (now - finishedAtLocal) / 600);
    ctx.save(); ctx.fillStyle = `rgba(0,0,0,${.6 * k})`; ctx.fillRect(0, 92, VW, VH); ctx.restore();
    if (top[0]) { const s = `WINNER: ${top[0].name}`; glowText(ctx, '🏁 🏁 🏁', 360, 190, 44, '#fff'); glowText(ctx, s, 360, 260, Math.round(fit(ctx, s, 660, 60) * (0.6 + .4 * k)), T.accent3, T.accent); glowText(ctx, 'Bragging rights for the night! 😎', 360, 322, 26, '#fff', T.accent2); }
    const base = 760, cols = [[0, 360, 230, '#ffd700'], [1, 160, 160, '#c0c0c0'], [2, 560, 110, '#cd7f32']];
    for (const [i, x, h, col] of cols) { const m = top[i]; if (!m) continue; const hh = h * k;
      ctx.save(); ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 20; rr(ctx, x - 90, base - hh, 180, hh, 10); ctx.fill(); ctx.restore();
      glowText(ctx, String(i + 1), x, base - hh + 50, 56, '#222', '#fff');
      drawMarble(ctx, m, x, base - hh - 50, 40, m.idx || 0, 0);
      const nm = m.name; glowText(ctx, nm, x, base - hh - 110, fit(ctx, nm, 200, 26), '#fff', col);
    }
    champsPanel(820);
    // confetti
    for (const c of confetti) { c.vy += .35; c.x += c.vx; c.y += c.vy; c.r += .2; c.life++; ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r); ctx.fillStyle = c.c; ctx.fillRect(-5, -3, 10, 6); ctx.restore(); }
    confetti = confetti.filter(c => c.y < VH + 20 && c.life < 300);
  }

  // ---------- live data (same stable box link as gift-jar.html) ----------
  const BOX = 'https://approach-grandkid-sermon.ngrok-free.dev', H_ = { 'ngrok-skip-browser-warning': '1' };
  // ---------- test mode: 12 pretend names, endless races ----------
  const FAKE = ['Neon Nina', 'Cassette Kev', 'Rubik Rita', 'Walkman Wayne', 'Synth Sue', 'Arcade Andy', 'Mixtape Mia', 'Boombox Barry', 'Leg-Warmer Liz', 'Pac-Man Pete', 'Big Hair Brenda', 'Atari Annie'];
  const COLORS = ['#ff2bd6', '#00f0ff', '#ffe600', '#a74bff', '#39ff14', '#ff7a00', '#ff3860', '#3d7bff', '#ffffff', '#00ffa8', '#ff9cf0', '#c6ff00'];
  let testSt = null, testChamps = {};
  function testState(phase, extra) { testSt = Object.assign({ now: Date.now(), phase, champs: Object.entries(testChamps).map(([id, c]) => ({ id, name: c.name, wins: c.wins })).sort((a, b) => b.wins - a.wins), auto: { on: false, minutes: 3 } }, testSt && { marbles: testSt.marbles, raceId: testSt.raceId, seed: testSt.seed, startAt: testSt.startAt, openedAt: testSt.openedAt }, extra || {}); return testSt; }
  function testLoop() {
    const n = +(q.get('n') || 12);
    testSt = null; applyState(testState('entries', { marbles: [], openedAt: Date.now() }), 'open');
    let i = 0; const iv = setInterval(() => { if (i >= Math.min(n, FAKE.length * 3)) { clearInterval(iv); setTimeout(() => applyState(testState('countdown', { raceId: 'test' + Date.now(), seed: (Math.random() * 1e9) | 0, startAt: Date.now() + 4000 }), 'start'), 1200); return; }
      const nm = FAKE[i % FAKE.length] + (i >= FAKE.length ? ' ' + (1 + Math.floor(i / FAKE.length)) : ''), m = { id: 't' + i, name: nm, color: COLORS[i % COLORS.length], avatar: null }; i++;
      const st = testState('entries', { marbles: (testSt.marbles || []).concat(m) }); applyState(st, 'join', { marble: m });
      if (i === 5) applyState(st, 'cheer', { name: FAKE[1] });
    }, +(q.get('joinms') || 350));
  }
  function testFinish(order) {
    const w = race.marbles.find(m => m.id === order[0]); const c = testChamps[w.id] || { name: w.name, wins: 0 }; c.wins++; testChamps[w.id] = c;
    const st = testState('finished', { results: order.map((id, i) => ({ place: i + 1, id, name: race.marbles.find(m => m.id === id).name })) }); applyState(st, 'result');
    setTimeout(testLoop, +(q.get('pause') || 15000));
  }
  if (TEST) { testLoop(); requestAnimationFrame(frame); return; }

  const PATH = q.get('channel') === 'test' ? '/events?channel=test' : '/events';
  fetch(BOX + '/api/marble/state', { headers: H_, cache: 'no-store' }).then(r => r.json()).then(st => applyState(st, 'init')).catch(() => {});
  let ctrl = null, lastData = Date.now(), running = false;
  async function run() {
    if (running) return; running = true; lastData = Date.now(); ctrl = new AbortController();
    try {
      const r = await fetch(BOX + PATH, { headers: Object.assign({ Accept: 'text/event-stream' }, H_), cache: 'no-store', signal: ctrl.signal });
      if (!r.ok || !r.body) throw new Error('status ' + r.status);
      fetch(BOX + '/api/marble/state', { headers: H_, cache: 'no-store' }).then(r => r.json()).then(st => applyState(st, 'init')).catch(() => {});
      const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '';
      for (;;) {
        const { value, done } = await rd.read(); if (done) break;
        lastData = Date.now(); buf += dec.decode(value, { stream: true }).replace(/\r/g, '');
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
          const data = chunk.split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).replace(/^ /, '')).join('\n');
          if (data) { try { const d = JSON.parse(data); if (d && d.type === 'marble') { if (d.ev === 'cheer') toast(`📣 ${d.name || 'Someone'} cheers their marble on!`, T.accent2); else applyState(d.state, d.ev, d); } } catch (e) {} }
        }
      }
    } catch (e) {}
    try { ctrl.abort(); } catch (e) {}
    running = false; setTimeout(run, 3000);
  }
  setInterval(() => { if (running && Date.now() - lastData > 45000) { try { ctrl.abort(); } catch (e) {} } }, 10000);
  run();
  requestAnimationFrame(frame);
})();
</script>
