<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Oasis Radio Christmas Gift Tree</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<!-- oasis-overlay christmas-tree-gifts v5 -->
<!-- Oasis Radio Christmas Gift Tree. TikTok LIVE Studio browser source, 1080x1920 (or 720x1280). Transparent background.
     Gifts fall as wrapped presents; Bob the Bot catches each one and stacks it under the tree.
     ?demo=1 or ?test=1 simulates gifts (preview, no server needed).  ?channel=test listens to the test SSE channel.
     ?reset=1 empties the local pile only (does not touch the live gift jar).  ?names=0 hides gifter names.
     ?max=30 visible-pile cap.  ?per=8 presents per gift event cap.  ?rate=ms and ?n= count for demo bursts. -->
<style>
  html,body{margin:0;padding:0;background:transparent!important;overflow:hidden;width:100%;height:100%}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;background:transparent}
</style>
</head><body>
<canvas id="c"></canvas>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const DEMO = q.get('demo') === '1' || q.get('test') === '1';
  const NAMES = q.get('names') !== '0';
  const MAX = Math.max(8, Math.min(60, +(q.get('max') || 30)));
  const PER = Math.max(1, Math.min(20, +(q.get('per') || 8)));
  const STORE = 'oasisXmasTree.v1', KEEP_MS = 6 * 3600 * 1000;
  if (q.get('reset') === '1' || DEMO) { try { localStorage.removeItem(STORE); } catch (e) {} }

  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1, scene = null;

  const bobImg = new Image();
  bobImg.referrerPolicy = 'no-referrer';
  bobImg.src = 'images/donate/bob-still.webp';

  const EMO = [[/rose/i, '🌹'], [/heart ?me/i, '❤️'], [/galaxy/i, '🌌'], [/tiktok/i, '🎵'], [/finger ?heart/i, '🫰'], [/heart|love/i, '💖'], [/coffee/i, '☕'], [/donut|doughnut/i, '🍩'], [/ice ?cream/i, '🍦'], [/perfume/i, '💐'], [/gg/i, '🎮'], [/cap|hat/i, '🧢'], [/beer|cheers/i, '🍻'], [/lion/i, '🦁'], [/crown/i, '👑'], [/diamond/i, '💎'], [/money|gun/i, '💸'], [/firework/i, '🎆'], [/rocket|universe|planet/i, '🚀'], [/star/i, '⭐'], [/sun/i, '🌞'], [/rainbow/i, '🌈']];
  const emojiFor = n => (EMO.find(([rx]) => rx.test(n || '')) || [0, '🎁'])[1];
  const WRAPS = [
    { paper: '#c4282a', ribbon: '#f5d76e', edge: '#8b1a1c' },
    { paper: '#1f7a3a', ribbon: '#f5d76e', edge: '#0f4d24' },
    { paper: '#1e4d8c', ribbon: '#e8eef6', edge: '#0d2c54' },
    { paper: '#f3d38a', ribbon: '#c4282a', edge: '#c4a052' },
    { paper: '#6b3fa0', ribbon: '#f5d76e', edge: '#3d2460' },
    { paper: '#c45c26', ribbon: '#1f7a3a', edge: '#7a3414' },
    { paper: '#f4f0e6', ribbon: '#c4282a', edge: '#b7b19f' },
    { paper: '#0e6b5c', ribbon: '#f4f0e6', edge: '#08453c' }
  ];
  function wrapFor(s) {
    let h = 0; const t = String(s || 'gift');
    for (let i = 0; i < t.length; i++) h = (h * 33 + t.charCodeAt(i)) >>> 0;
    return WRAPS[h % WRAPS.length];
  }

  const imgCache = new Map(), emoCache = new Map();
  function loadImg(url) {
    if (!url) return null;
    if (imgCache.has(url)) return imgCache.get(url);
    const im = new Image(); im.referrerPolicy = 'no-referrer'; im.decoding = 'async';
    im.onerror = () => { im._bad = true; }; im.src = url; imgCache.set(url, im); return im;
  }
  function emojiCanvas(e) {
    if (emoCache.has(e)) return emoCache.get(e);
    const s = 96, c = document.createElement('canvas'); c.width = c.height = s;
    const x = c.getContext('2d'); x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = `${s * 0.78}px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif`;
    x.fillText(e, s / 2, s / 2 + s * 0.05);
    emoCache.set(e, c); return c;
  }

  // ---- easing ----
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeIn = t => t * t;
  const easeOut = t => 1 - (1 - t) * (1 - t);
  const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const easeOutBack = t => { const c = 1.2; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

  // ---- scene layout ----
  let flakes = [];
  function layout() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const treeH = Math.min(H * 0.38, W * 0.88);
    const treeW = treeH * 0.78;
    const ground = H - Math.max(14, H * 0.025);
    const cx = W * 0.64;
    const top = ground - treeH;
    scene = {
      cx, ground, top, treeH, treeW,
      left: cx - treeW / 2, right: cx + treeW / 2,
      trunkW: treeW * 0.12, trunkH: treeH * 0.14,
      moundR: treeW * 0.62
    };
    const nFlakes = Math.round(clamp(22 + W * H / 90000, 18, 36));
    if (flakes.length !== nFlakes) {
      flakes = Array.from({ length: nFlakes }, () => ({
        x: Math.random(), y: Math.random(), r: 0.8 + Math.random() * 2.2,
        v: 0.18 + Math.random() * 0.45, w: Math.random() * 6
      }));
    }
    reflowSlots();
    bakeTree();
    if (!bob.ready) {
      bob.x = bobHomeX(); bob.y = scene.ground; bob.ready = true;
    } else {
      if (!current) { /* keep him where he last stood, just on the ground */ bob.y = scene.ground; }
    }
  }

  const bob = { x: 0, y: 0, facing: 1, hop: 0, bounce: 0, reach: 0, ready: false, phase: 'idle', walkT: 0, pomT: 9999, pomNext: 1800,
    idleName: null, idleT: 0, idleDur: 0, idleGap: 550, idleNudge: null,
    pose: { walkOn: 0, lookUp: 0, headTilt: 0, squash: 1, crouch: 0, reach: 0, lean: 0, pom: 0, breathe: 0, gaitHop: 0, idleBounce: 0, hatTilt: 0 } };
  const sparkles = [];
  let treeBake = null, treeBakeKey = '', treeLights = [], treeStar = null, catchFlash = 0;
  function bobSize() {
    const h = Math.min(H * 0.24, W * 0.42);
    const ratio = (bobImg.naturalWidth && bobImg.naturalHeight) ? (bobImg.naturalWidth / bobImg.naturalHeight) : (432 / 708);
    return { h, w: h * ratio };
  }
  function bobHands(b) {
    const s = bobSize();
    const P = b.pose || {};
    const yBase = b.y - (b.hop || 0) - (b.bounce || 0) - (P.gaitHop || 0) - (P.idleBounce || 0);
    const hold = lerp(0.50, 0.57, P.reach || 0);
    const down = (P.crouch || 0) * s.h * 0.12;
    return { x: b.x + b.facing * s.w * 0.04, y: yBase - s.h * hold + down };
  }
  function bobHomeX() {
    // Stand right beside the tree, just left of the red skirt, overlapping it slightly.
    const s = bobSize();
    const skirtL = scene.cx - scene.moundR * 0.92;
    return clamp(skirtL - s.w * 0.38, s.w * 0.42, scene.left - s.w * 0.12);
  }

  // ---- presents ----
  const placed = [];   // settled under the tree
  const queue = [];    // waiting gift events
  let current = null;  // in-flight catch { present, phase, t, ... }
  const floatNames = [];

  function sizeFor(diamonds) {
    const base = Math.min(W, H) * 0.062;
    const s = base * (1 + Math.min(1.2, Math.log10(1 + (diamonds || 1)) * 0.4));
    return { w: s * 1.18, h: s * 0.96 };
  }
  function makePresent(evt) {
    const sz = sizeFor(evt.diamonds);
    return {
      w: sz.w, h: sz.h,
      x: 0, y: 0, rot: (Math.random() - 0.5) * 0.25,
      wrap: wrapFor((evt.giftName || '') + '|' + (evt.display || evt.user || '')),
      img: loadImg(evt.img),
      emoji: emojiFor(evt.giftName),
      giftName: evt.giftName || 'Gift',
      display: evt.display || '',
      url: evt.img || null,
      diamonds: evt.diamonds || 0,
      born: Date.now(),
      scale: 1, alpha: 1
    };
  }

  function slotLayout(n) {
    if (!scene || n <= 0) return [];
    // Rows from back to front, filling a wide pile under the tree. Older presents
    // are packed into earlier (back) rows and visually compressed when over cap.
    const vis = Math.min(n, MAX);
    const hidden = n - vis;
    const rows = [];
    let left = vis;
    let row = 0;
    const maxFront = 12;
    while (left > 0) {
      const cap = Math.max(6, maxFront - row);
      const take = Math.min(cap, left);
      rows.unshift(take); // unshift so index 0 is back
      left -= take; row++;
    }
    const slots = [];
    const compress = vis >= MAX ? 0.82 : vis > 18 ? 0.9 : 1;
    const baseY = scene.ground - Math.min(W, H) * 0.028;
    let idx = hidden; // first visible maps to placed[hidden]
    const rowHs = rows.map((count, ri) => {
      return Math.min(W, H) * 0.06 * (0.88 + 0.14 * (ri / Math.max(1, rows.length - 1))) * compress;
    });
    // Front row (last in rows) sits on the snow; earlier rows step up behind it.
    let y = baseY;
    const laid = [];
    for (let ri = rows.length - 1; ri >= 0; ri--) {
      const count = rows[ri];
      const backness = rows.length === 1 ? 0 : 1 - ri / Math.max(1, rows.length - 1);
      const scale = lerp(1, 0.76, backness) * compress;
      const spread = scene.treeW * lerp(1.95, 1.55, backness) * compress;
      const rowY = y;
      laid.unshift({ count, ri, scale, spread, y: rowY });
      y -= rowHs[ri] * 0.62;
    }
    laid.forEach(row => {
      for (let i = 0; i < row.count; i++) {
        const u = row.count === 1 ? 0.5 : i / (row.count - 1);
        const x = scene.cx + (u - 0.5) * row.spread;
        const jitter = ((idx * 17) % 7 - 3) * 0.6;
        const mX = Math.min(W, H) * 0.05; slots.push({ i: idx, x: clamp(x + jitter, mX, W - mX), y: row.y, scale: row.scale, z: row.ri });
        idx++;
      }
    });
    return slots;
  }

  function reflowSlots() {
    const slots = slotLayout(placed.length);
    const hidden = Math.max(0, placed.length - slots.length);
    placed.forEach((p, i) => {
      if (i < hidden) { p.hidden = true; p.alpha = 0; return; }
      const s = slots[i - hidden];
      p.hidden = false;
      p.slotX = s.x; p.slotY = s.y; p.slotScale = s.scale; p.z = s.z;
      if (p.settled) { p.x = s.x; p.y = s.y; p.scale = s.scale; p.alpha = 1; }
    });
  }

  function nextSlotPreview() {
    // Temporary slot for the in-flight present, as if it were already placed.
    const fake = placed.length + 1;
    const slots = slotLayout(fake);
    const hidden = Math.max(0, fake - slots.length);
    const s = slots[fake - 1 - hidden] || { x: scene.cx, y: scene.ground, scale: 1 };
    return s;
  }

  // ---- queue / catch choreography ----
  function speedMul() {
    const n = queue.length + (current ? 1 : 0);
    if (n >= 10) return 2.05;
    if (n >= 5) return 1.65;
    if (n >= 2) return 1.3;
    return 1;
  }

  function enqueue(evt) {
    const n = Math.max(1, Math.min(PER, Number(evt.count) || 1));
    for (let i = 0; i < n; i++) queue.push(evt);
    if (NAMES && evt.display) {
      floatNames.push({ text: (n > 1 ? evt.display + ' ×' + n : evt.display).slice(0, 30), born: Date.now() });
      if (floatNames.length > 4) floatNames.shift();
    }
  }
  function drop(evt) { enqueue(evt); }
  window.__drop = drop;

  function startNext() {
    if (current || !queue.length || !scene) return;
    const ev = queue.shift();
    const present = makePresent(ev);
    const bs = bobSize();
    const home = bobHomeX();
    const catchLo = home - bs.w * 0.10;
    const catchHi = Math.min(scene.left - 18, home + bs.w * 0.32);
    const catchX = lerp(catchLo, Math.max(catchLo + 8, catchHi), Math.random());
    const catchY = scene.ground - bs.h * 0.62;
    present.x = catchX + (Math.random() - 0.5) * 36;
    present.y = -present.h - 10;
    present.rot = (Math.random() - 0.5) * 0.4;
    current = {
      present, phase: 'fall', t: 0,
      catchX, catchY,
      fallX0: present.x, fallY0: present.y,
      bobX0: bob.x, bobY0: scene.ground,
      spin: (Math.random() - 0.5) * 1.2
    };
    endIdleAct();
    bob.facing = catchX >= bob.x ? 1 : -1;
    bob.phase = 'run';
  }

  function settleGift() {
    const p = current.present;
    const slot = current.slot || nextSlotPreview();
    p.x = slot.x; p.y = slot.y; p.scale = slot.scale; p.rot = (Math.random() - 0.5) * 0.12;
    p.settled = true; p.hidden = false; p.alpha = 1;
    placed.push(p);
    if (placed.length > MAX) {
      const extra = placed.length - MAX;
      placed.splice(0, extra);
    }
    reflowSlots();
    save();
  }
  function finishPlace() {
    settleGift();
    // Streaks stay snappy: if more gifts are waiting, start the next catch straight away.
    // After the last gift in a burst, cheer then walk home so the loop reads clearly.
    if (queue.length) {
      current = null;
      bob.phase = 'run';
      startNext();
    } else {
      current = { phase: 'cheer', t: 0, present: null };
      bob.phase = 'cheer';
    }
  }

  function easePose(key, target, k) {
    bob.pose[key] = lerp(bob.pose[key] || 0, target, k);
  }
  function moveBobTowards(targetX, dt, pace) {
    const paceN = pace || 1;
    const dist = targetX - bob.x;
    const vmax = paceN * 0.58 * dt;
    if (Math.abs(dist) <= 3) {
      bob.x = targetX;
      easePose('walkOn', 0, 0.2);
      easePose('lean', 0, 0.15);
      return true;
    }
    bob.facing = dist >= 0 ? 1 : -1;
    bob.x += Math.sign(dist) * Math.min(Math.abs(dist), vmax);
    bob.walkT += dt * 0.013 * paceN;
    easePose('walkOn', 1, 0.3);
    bob.pose.lean = bob.facing * (0.10 + 0.04 * paceN) + Math.sin(bob.walkT) * 0.035;
    return false;
  }
  function gaitHopNow() {
    const P = bob.pose;
    return Math.abs(Math.sin(bob.walkT)) * Math.min(18, (bobSize().h || 80) * 0.032) * (P.walkOn || 0);
  }
  function tickPom(dt) {
    bob.pomT += dt;
    if (bob.pomT >= bob.pomNext) { bob.pomT = 0; bob.pomNext = 3200 + Math.random() * 4200; }
    const t = bob.pomT;
    bob.pose.pom = (t < 700) ? Math.sin(t / 700 * Math.PI * 3.2) * Math.exp(-t / 420) : 0;
  }

  function spawnCatchBurst(x, y) {
    const cols = ['#fff7d6', '#ffe566', '#ffffff', '#ffd36a', '#ffe9b0', '#fff'];
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2 + Math.random() * 0.35;
      const sp = 1.6 + Math.random() * 2.8;
      sparkles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.8,
        life: 1, decay: 0.03 + Math.random() * 0.02,
        r: 5 + Math.random() * 6, rot: Math.random() * Math.PI, color: cols[i % cols.length]
      });
    }
    catchFlash = 1;
  }
  function updateSparkles(dt) {
    catchFlash = Math.max(0, catchFlash - dt * 0.004);
    for (let i = sparkles.length - 1; i >= 0; i--) {
      const s = sparkles[i];
      s.x += s.vx * dt * 0.35; s.y += s.vy * dt * 0.35; s.vy += dt * 0.003;
      s.life -= s.decay * dt * 0.06; s.rot += dt * 0.004;
      if (s.life <= 0) sparkles.splice(i, 1);
    }
  }

  const IDLE_ACTS = ['dance', 'wave', 'star', 'hat', 'tap', 'tidy'];

  function clearIdleNudge() {
    const n = bob.idleNudge;
    if (n && n.p) { n.p.wobbleX = 0; n.p.wobbleY = 0; n.p.wobbleR = 0; }
    bob.idleNudge = null;
  }
  function endIdleAct() {
    bob.idleName = null;
    bob.idleT = 0;
    bob.idleDur = 0;
    bob.idleGap = 650 + Math.random() * 850;
    clearIdleNudge();
  }
  function pickIdleAct() {
    const acts = IDLE_ACTS.filter(a => a !== bob.idleName);
    return acts[(Math.random() * acts.length) | 0];
  }
  function startIdleAct(name) {
    if (!scene) return;
    const act = name && IDLE_ACTS.indexOf(name) >= 0 ? name : pickIdleAct();
    clearIdleNudge();
    bob.idleName = act;
    bob.idleT = 0;
    bob.phase = 'idle';
    bob.idleDur = act === 'tidy' ? 2500 : act === 'dance' ? 2800 : act === 'wave' ? 2000 : 1800;
    if (act === 'hat' || act === 'wave') { bob.pomT = 0; bob.pomNext = 3600 + Math.random() * 2000; }
    if (act === 'tidy') {
      const vis = placed.filter(p => p.settled && !p.hidden);
      let targetX, gift = null;
      if (vis.length) {
        gift = vis.reduce((best, g) => Math.abs((g.x || 0) - bob.x) < Math.abs((best.x || 0) - bob.x) ? g : best);
        const side = Math.sign((gift.x || scene.cx) - bob.x) || 1;
        targetX = (gift.x || scene.cx) - side * bobSize().w * 0.26;
      } else {
        targetX = scene.cx - scene.moundR * 0.62;
      }
      targetX = clamp(targetX, bobHomeX() - bobSize().w * 0.08, scene.cx - scene.trunkW * 1.2);
      bob.idleNudge = { p: gift, targetX, home: bobHomeX() };
    }
  }
  function forceIdle(name) {
    if (current) return false;
    startIdleAct(name);
    return true;
  }
  window.__idle = forceIdle;

  function tickIdle(dt, now) {
    const s = bobSize();
    const home = bobHomeX();
    const act = bob.idleName;
    const dancing = act === 'dance';
    const beat = now / (dancing ? 230 : 300);
    const amp = dancing ? 0.048 : 0.032;
    bob.pose.idleBounce = Math.abs(Math.sin(beat)) * s.h * amp;
    bob.pose.breathe = 0.5 + 0.5 * Math.sin(now / 520);
    easePose('squash', 1 + Math.sin(beat) * (dancing ? 0.06 : 0.042), 0.22);

    // Walk back to his spot beside the tree before starting a bit, unless tidy is mid-walk.
    if (!act && Math.abs(bob.x - home) > 6) {
      moveBobTowards(home, dt, 0.9);
      easePose('headTilt', 0, 0.15);
      easePose('lookUp', 0, 0.12);
      easePose('crouch', 0, 0.15);
      easePose('reach', 0, 0.15);
      easePose('hatTilt', 0, 0.15);
      bob.hop = lerp(bob.hop, 0, 0.2);
      bob.bounce = lerp(bob.bounce, 0, 0.2);
      return;
    }

    if (!act) {
      bob.facing = 1;
      bob.walkT += dt * 0.0055;
      easePose('walkOn', 0.28, 0.08);
      easePose('lean', Math.sin(now / 400) * 0.14, 0.16);
      easePose('headTilt', Math.sin(now / 720) * 0.28, 0.12);
      easePose('lookUp', 0, 0.1);
      easePose('crouch', 0, 0.12);
      easePose('reach', 0, 0.12);
      easePose('hatTilt', 0, 0.12);
      bob.hop = lerp(bob.hop, 0, 0.2);
      bob.bounce = lerp(bob.bounce, 0, 0.2);
      bob.idleGap -= dt;
      if (bob.idleGap <= 0) startIdleAct(pickIdleAct());
      return;
    }

    bob.idleT += dt;
    const u = clamp(bob.idleT / Math.max(1, bob.idleDur), 0, 1);

    if (act === 'dance') {
      bob.facing = 1;
      bob.walkT += dt * 0.017;
      easePose('walkOn', 0.95, 0.2);
      bob.pose.lean = Math.sin(bob.walkT) * 0.22;
      bob.pose.headTilt = Math.sin(bob.walkT * 0.5) * 0.7;
      easePose('lookUp', 0.15 + 0.1 * Math.sin(bob.walkT), 0.15);
      easePose('crouch', 0, 0.15);
      easePose('hatTilt', Math.sin(bob.walkT) * 0.12, 0.2);
      bob.hop = Math.abs(Math.sin(bob.walkT)) * s.h * 0.018;
    } else if (act === 'wave') {
      bob.facing = 1;
      const flap = Math.sin(bob.idleT / 130);
      const intro = easeOut(clamp(u / 0.12, 0, 1)) * (u < 0.88 ? 1 : 1 - (u - 0.88) / 0.12);
      easePose('walkOn', 0.2, 0.15);
      bob.pose.lean = 0.10 + flap * 0.16 * intro;
      bob.pose.headTilt = (0.45 + flap * 0.7) * intro;
      easePose('lookUp', 0.08, 0.15);
      easePose('crouch', 0, 0.15);
      easePose('hatTilt', flap * 0.15 * intro, 0.2);
      bob.hop = Math.abs(Math.sin(u * Math.PI * 3.2)) * s.h * 0.07 * intro;
    } else if (act === 'star') {
      bob.facing = 1;
      const up = u < 0.22 ? easeOut(u / 0.22) : u > 0.75 ? 1 - easeIn((u - 0.75) / 0.25) : 1;
      easePose('walkOn', 0.2, 0.12);
      easePose('lookUp', up, 0.2);
      easePose('lean', -0.06 * up, 0.15);
      easePose('headTilt', 0.12 * up, 0.12);
      easePose('crouch', 0, 0.15);
      easePose('hatTilt', -0.08 * up, 0.15);
      bob.hop = (u < 0.25 ? Math.sin((u / 0.25) * Math.PI) : 0) * s.h * 0.03;
    } else if (act === 'hat') {
      bob.facing = 1;
      const g = u < 0.18 ? easeOut(u / 0.18) : u > 0.78 ? 1 - easeIn((u - 0.78) / 0.22) : 1;
      const wiggle = Math.sin(bob.idleT / 110);
      easePose('walkOn', 0.18, 0.12);
      bob.pose.headTilt = (0.35 + wiggle * 0.25) * g;
      easePose('lookUp', 0.2 * g, 0.15);
      bob.pose.hatTilt = (0.55 + wiggle * 0.7) * g;
      easePose('lean', 0.05 * g, 0.15);
      easePose('crouch', 0, 0.15);
      bob.hop = Math.abs(Math.sin(u * Math.PI * 2)) * s.h * 0.02 * g;
    } else if (act === 'tap') {
      bob.facing = 1;
      const g = u < 0.14 ? easeOut(u / 0.14) : u > 0.82 ? 1 - easeIn((u - 0.82) / 0.18) : 1;
      const tap = Math.max(0, Math.sin(bob.idleT / 85));
      easePose('walkOn', 0.18, 0.12);
      bob.pose.headTilt = (-0.55 - tap * 0.35) * g;
      easePose('lookUp', 0.18 * g, 0.15);
      easePose('lean', 0.08 * g, 0.15);
      easePose('crouch', 0, 0.15);
      easePose('hatTilt', 0.08 * tap * g, 0.2);
      bob.hop = tap * s.h * 0.012 * g;
    } else if (act === 'tidy') {
      const n = bob.idleNudge || { targetX: home, home, p: null };
      if (u < 0.34) {
        moveBobTowards(n.targetX, dt, 0.95);
        easePose('crouch', 0, 0.15);
        easePose('lookUp', 0, 0.15);
        easePose('hatTilt', 0, 0.15);
        bob.hop = lerp(bob.hop, 0, 0.2);
      } else if (u < 0.72) {
        if (Math.abs(bob.x - n.targetX) > 3) moveBobTowards(n.targetX, dt, 0.8);
        else { easePose('walkOn', 0, 0.25); easePose('lean', 0.06, 0.15); }
        const c = easeOut(clamp((u - 0.34) / 0.16, 0, 1));
        easePose('crouch', c, 0.25);
        easePose('headTilt', 0.35 * c, 0.15);
        easePose('lookUp', 0.08 * c, 0.15);
        bob.hop = lerp(bob.hop, 0, 0.25);
        if (n.p) {
          const wig = Math.sin((u - 0.34) / 0.38 * Math.PI * 3.2) * c;
          n.p.wobbleX = wig * 8;
          n.p.wobbleR = wig * 0.08;
        }
      } else {
        if (n.p) {
          n.p.wobbleX = lerp(n.p.wobbleX || 0, 0, 0.25);
          n.p.wobbleR = lerp(n.p.wobbleR || 0, 0, 0.25);
        }
        easePose('crouch', 0, 0.2);
        easePose('headTilt', 0, 0.15);
        moveBobTowards(n.home, dt, 0.95);
      }
    }

    if (u >= 1) {
      if (act === 'tidy') clearIdleNudge();
      endIdleAct();
      bob.x = Math.abs(bob.x - home) <= 8 ? home : bob.x;
      bob.facing = 1;
    }
  }

  function updateAnim(dt) {
    if (!scene) return;
    const spd = speedMul();
    updateSparkles(dt);
    tickPom(dt);
    const now = performance.now();
    bob.pose.gaitHop = gaitHopNow();

    if (!current) {
      startNext();
      if (!current) tickIdle(dt, now);
      return;
    }

    const c = current, p = c.present;
    c.t += dt * spd;
    bob.pose.breathe = 0;
    // Keep a little bounce even mid-catch so he never freezes, but stay out of the way of the hop.
    bob.pose.idleBounce = Math.abs(Math.sin(now / 300)) * bobSize().h * 0.010;
    easePose('hatTilt', 0, 0.2);

    if (c.phase === 'fall') {
      // Gift falls; Bob looks up and shuffles underneath it, then hops to meet it.
      const dur = 920;
      const u = clamp(c.t / dur, 0, 1);
      p.x = lerp(c.fallX0, c.catchX, u);
      p.y = lerp(c.fallY0, c.catchY, easeIn(u));
      p.rot += c.spin * dt * 0.003;
      moveBobTowards(c.catchX, dt, 1.05);
      easePose('lookUp', easeOut(clamp((u - 0.1) / 0.5, 0, 1)), 0.2);
      easePose('reach', easeOut(clamp((u - 0.55) / 0.4, 0, 1)), 0.2);
      easePose('headTilt', 0, 0.2);
      easePose('crouch', 0, 0.2);
      easePose('squash', 1, 0.15);
      const jmp = clamp((u - 0.62) / 0.38, 0, 1);
      bob.hop = Math.sin(jmp * Math.PI * 0.9) * Math.min(42, H * 0.026);
      bob.bounce = 0;
      if (u >= 1) { c.phase = 'catch'; c.t = 0; bob.phase = 'catch'; spawnCatchBurst(c.catchX, c.catchY); }
    } else if (c.phase === 'catch') {
      const dur = 340;
      const u = clamp(c.t / dur, 0, 1);
      easePose('lookUp', 1 - easeIn(u) * 0.5, 0.3);
      easePose('reach', 1, 0.35);
      easePose('walkOn', 0, 0.25);
      easePose('lean', 0, 0.2);
      // Squash on impact, then a little pop.
      const sq = u < 0.45 ? lerp(1, 0.84, easeOut(u / 0.45)) : lerp(0.84, 1.06, easeOut((u - 0.45) / 0.3));
      bob.pose.squash = u < 0.75 ? sq : lerp(sq, 1, (u - 0.75) / 0.25);
      bob.bounce = -16 * Math.sin(u * Math.PI);
      bob.hop = lerp(bob.hop, Math.min(22, H * 0.012), 0.2);
      const hands = bobHands(bob);
      p.x = lerp(c.catchX, hands.x, easeOut(Math.min(1, u * 1.6)));
      p.y = lerp(c.catchY, hands.y, easeOut(Math.min(1, u * 1.6)));
      p.rot = lerp(p.rot, 0, 0.3);
      if (u >= 1) {
        c.phase = 'carry'; c.t = 0; bob.phase = 'carry';
        c.slot = nextSlotPreview();
        c.bobX0 = bob.x; c.bobY0 = scene.ground;
        bob.facing = c.slot.x >= bob.x ? 1 : -1;
      }
    } else if (c.phase === 'carry') {
      const dur = 880;
      const u = clamp(c.t / dur, 0, 1);
      const s = bobSize();
      const destX = c.slot.x - bob.facing * s.w * 0.08;
      moveBobTowards(destX, dt, 1.2);
      easePose('reach', 1, 0.2);           // gift held up while jogging
      easePose('lookUp', 0, 0.12);
      easePose('squash', 1, 0.15);
      easePose('crouch', 0, 0.2);
      bob.hop = lerp(bob.hop, 0, 0.2);
      bob.bounce = lerp(bob.bounce, 0, 0.25);
      const hands = bobHands(bob);
      p.x = hands.x;
      p.y = hands.y - Math.sin(bob.walkT) * 4;
      p.rot = Math.sin(bob.walkT) * 0.08;
      if (u >= 1 || Math.abs(bob.x - destX) <= 4 && u > 0.55) {
        c.phase = 'place'; c.t = 0; bob.phase = 'place'; c.placeX0 = p.x; c.placeY0 = p.y;
        c.slot = c.slot || nextSlotPreview();
      }
    } else if (c.phase === 'place') {
      const dur = 420;
      const u = clamp(c.t / dur, 0, 1);
      easePose('walkOn', 0, 0.25);
      easePose('lean', 0, 0.2);
      easePose('lookUp', 0, 0.2);
      // Bend down, then the gift slides into the pile.
      easePose('crouch', u < 0.45 ? easeOut(u / 0.45) : 1, 0.35);
      easePose('reach', 1 - easeIn(clamp((u - 0.2) / 0.5, 0, 1)), 0.25);
      easePose('squash', 1 - 0.06 * Math.sin(Math.min(1, u * 1.2) * Math.PI), 0.25);
      bob.hop = lerp(bob.hop, 0, 0.3);
      bob.bounce = lerp(bob.bounce, 0, 0.3);
      const slide = easeInOut(clamp((u - 0.2) / 0.75, 0, 1));
      p.x = lerp(c.placeX0, c.slot.x, slide);
      p.y = lerp(c.placeY0, c.slot.y, slide);
      p.scale = lerp(1, c.slot.scale, slide);
      p.rot = lerp(p.rot, 0, 0.3);
      if (u >= 1) finishPlace();
    } else if (c.phase === 'cheer') {
      const dur = 520;
      const u = clamp(c.t / dur, 0, 1);
      easePose('crouch', 0, 0.18);
      easePose('reach', 0, 0.2);
      easePose('walkOn', 0, 0.2);
      easePose('lookUp', 0, 0.2);
      easePose('squash', 1, 0.2);
      // Head tilt / little nod, hat pom already wiggling.
      bob.pose.headTilt = Math.sin(u * Math.PI) * 0.85;
      bob.hop = Math.sin(u * Math.PI) * 8;
      bob.bounce = 0;
      if (u >= 1) {
        c.phase = 'home'; c.t = 0; bob.phase = 'home';
        bob.pose.headTilt = 0;
      }
    } else if (c.phase === 'home') {
      const home = bobHomeX();
      const arrived = moveBobTowards(home, dt, 0.9);
      easePose('headTilt', 0, 0.2);
      easePose('reach', 0, 0.2);
      easePose('crouch', 0, 0.2);
      easePose('lookUp', 0, 0.2);
      bob.hop = lerp(bob.hop, 0, 0.2);
      if (arrived || c.t > 1800) {
        current = null;
        bob.phase = 'idle';
        bob.x = arrived ? home : bob.x;
        startNext();
      }
    }
  }

  // ---- drawing ----
  function rr(x, y, w, h, r) {
    const rad = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }
  function glowDot(x, y, r, color, a) {
    ctx.globalAlpha = a * 0.35;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, r * 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = a;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function starPath(x, y, r, rot) {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = rot + -Math.PI / 2 + i * Math.PI * 2 / 5;
      const b = a + Math.PI / 5;
      const x1 = x + Math.cos(a) * r, y1 = y + Math.sin(a) * r;
      const x2 = x + Math.cos(b) * r * 0.42, y2 = y + Math.sin(b) * r * 0.42;
      if (i === 0) ctx.moveTo(x1, y1); else ctx.lineTo(x1, y1);
      ctx.lineTo(x2, y2);
    }
    ctx.closePath();
  }

  // Seeded RNG so a resize rebakes a stable tree (same silhouette, same light anchors).
  function treeRng(seed) {
    let a = seed | 0;
    return function () {
      a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function bakeTree() {
    const s = scene;
    const key = W + 'x' + H + 'x' + DPR.toFixed(2);
    if (treeBake && treeBakeKey === key) return;
    treeBakeKey = key;
    const padX = s.treeW * 0.18, padTop = s.treeH * 0.16, padBot = s.treeH * 0.06;
    const originX = s.left - padX, originY = s.top - padTop;
    const cw = s.treeW + padX * 2, ch = s.treeH + padTop + padBot;
    const c = document.createElement('canvas');
    c.width = Math.ceil(cw * DPR); c.height = Math.ceil(ch * DPR);
    const g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    const lx = sx => sx - originX, ly = sy => sy - originY;
    const rand = treeRng(20261225);
    const rnd = (a, b) => a + rand() * (b - a);

    function firWidth(u) {
      const uu = clamp(u, 0, 1);
      // Classic fir: narrow tip, fills out, slightly plump in the lower-middle.
      const shape = Math.pow(uu, 0.72) * (1 + 0.06 * Math.sin(uu * Math.PI));
      return s.treeW * lerp(0.07, 1, shape);
    }
    function tierY(u) {
      return s.top + s.treeH * 0.07 + u * (s.treeH * 0.80);
    }

    // ---- tree skirt + snow mound ----
    const skirtY = s.ground + 2, skirtRx = s.moundR * 0.92, skirtRy = Math.max(26, s.treeH * 0.085);
    const mound = g.createRadialGradient(lx(s.cx), ly(s.ground), 6, lx(s.cx), ly(s.ground - 4), s.moundR);
    mound.addColorStop(0, 'rgba(255,255,255,0.82)');
    mound.addColorStop(0.55, 'rgba(230,244,255,0.40)');
    mound.addColorStop(1, 'rgba(230,244,255,0)');
    g.fillStyle = mound;
    g.beginPath(); g.ellipse(lx(s.cx), ly(s.ground + 6), s.moundR, Math.max(22, s.treeH * 0.08), 0, Math.PI, 0, true); g.fill();

    // Red skirt with folds and a gold + white-fur hem.
    g.save();
    g.translate(lx(s.cx), ly(skirtY));
    g.fillStyle = '#7a1218';
    g.beginPath(); g.ellipse(0, 0, skirtRx, skirtRy, 0, Math.PI, 0, true); g.fill();
    const folds = 7;
    for (let i = 0; i < folds; i++) {
      const a = Math.PI + (i + 0.5) / folds * Math.PI;
      g.strokeStyle = 'rgba(40,0,4,0.28)';
      g.lineWidth = 2;
      g.beginPath();
      g.moveTo(Math.cos(a) * 8, -4);
      g.quadraticCurveTo(Math.cos(a) * skirtRx * 0.55, -skirtRy * 0.35, Math.cos(a) * skirtRx * 0.95, Math.sin(a) * skirtRy * 0.15);
      g.stroke();
    }
    const skirtFill = g.createRadialGradient(0, -skirtRy * 0.4, 8, 0, 0, skirtRx);
    skirtFill.addColorStop(0, 'rgba(190,36,42,0.95)');
    skirtFill.addColorStop(0.55, '#b01c24');
    skirtFill.addColorStop(1, '#6e1016');
    g.fillStyle = skirtFill;
    g.beginPath(); g.ellipse(0, -2, skirtRx * 0.98, skirtRy * 0.92, 0, Math.PI, 0, true); g.fill();
    // gold braid
    g.strokeStyle = '#e2c35a'; g.lineWidth = Math.max(2, s.treeW * 0.008); g.globalAlpha = 0.9;
    g.beginPath(); g.ellipse(0, -1, skirtRx * 0.96, skirtRy * 0.78, 0, Math.PI, 0, true); g.stroke();
    g.globalAlpha = 1;
    // fluffy white hem
    for (let i = 0; i <= 22; i++) {
      const a = Math.PI + i / 22 * Math.PI;
      const px = Math.cos(a) * skirtRx * 0.98, py = Math.sin(a) * skirtRy * 0.55 - 2;
      g.fillStyle = i % 2 ? '#fff' : '#f3f0e8';
      g.beginPath(); g.ellipse(px, py, 7 + (i % 3), 5, a, 0, Math.PI * 2); g.fill();
    }
    g.restore();

    // ---- trunk + bark + wooden stand ----
    const tw = s.trunkW * 0.85, th = s.trunkH * 1.15;
    const tx = lx(s.cx), ty0 = ly(s.ground - 8), ty1 = ly(s.ground - th);
    // stand
    g.fillStyle = '#4a2a12';
    g.beginPath(); g.moveTo(tx - tw * 1.15, ty0 + 2); g.lineTo(tx - tw * 0.2, ty0 - 10); g.lineTo(tx + tw * 0.2, ty0 - 10); g.lineTo(tx + tw * 1.15, ty0 + 2); g.closePath(); g.fill();
    g.fillStyle = '#3a1f0c';
    g.fillRect(tx - tw * 1.2, ty0, tw * 2.4, 5);
    // trunk
    const bark = g.createLinearGradient(tx - tw / 2, 0, tx + tw / 2, 0);
    bark.addColorStop(0, '#3a2210'); bark.addColorStop(0.35, '#7a4a22'); bark.addColorStop(0.55, '#9a6230'); bark.addColorStop(1, '#4a2812');
    g.fillStyle = bark;
    g.beginPath();
    g.moveTo(tx - tw * 0.42, ty1);
    g.lineTo(tx + tw * 0.42, ty1);
    g.lineTo(tx + tw * 0.58, ty0 - 4);
    g.lineTo(tx - tw * 0.58, ty0 - 4);
    g.closePath(); g.fill();
    g.save(); g.beginPath();
    g.moveTo(tx - tw * 0.42, ty1); g.lineTo(tx + tw * 0.42, ty1); g.lineTo(tx + tw * 0.58, ty0 - 4); g.lineTo(tx - tw * 0.58, ty0 - 4); g.closePath(); g.clip();
    for (let i = 0; i < 18; i++) {
      g.strokeStyle = rand() > 0.5 ? 'rgba(30,14,6,0.45)' : 'rgba(120,70,30,0.28)';
      g.lineWidth = 1 + rand() * 1.6;
      const x = tx + rnd(-tw * 0.5, tw * 0.5);
      g.beginPath(); g.moveTo(x, ty1); g.quadraticCurveTo(x + rnd(-3, 3), (ty1 + ty0) / 2, x + rnd(-2, 2), ty0); g.stroke();
    }
    g.restore();

    // ---- layered irregular foliage (back to front) ----
    const tiers = 10;
    for (let i = 0; i < tiers; i++) {
      const u0 = i / tiers, u1 = (i + 1.15) / tiers;
      const yTop = tierY(u0) - (i === 0 ? s.treeH * 0.02 : s.treeH * 0.012);
      const yBot = tierY(Math.min(1, u1));
      const wBot = firWidth(Math.min(1, u1 * 0.98));
      const wTop = firWidth(u0) * 0.45;
      // back depth plate
      g.fillStyle = i < 3 ? '#0c2614' : '#12301a';
      g.beginPath();
      g.moveTo(lx(s.cx), ly(yTop - 6));
      g.lineTo(lx(s.cx + wBot * 0.52), ly(yBot + 4));
      g.quadraticCurveTo(lx(s.cx), ly(yBot + 16), lx(s.cx - wBot * 0.52), ly(yBot + 4));
      g.closePath(); g.fill();

      const lobes = 6 + i;
      // Irregular polygon: tip -> right slope -> scalloped hem -> left slope
      g.beginPath();
      g.moveTo(lx(s.cx), ly(yTop));
      const steps = 5 + i;
      // right slope
      for (let k = 1; k <= steps; k++) {
        const tS = k / steps;
        const yu = lerp(yTop, yBot, tS);
        const half = lerp(wTop * 0.15, wBot * 0.5, Math.pow(tS, 0.85)) * (1 + (rand() - 0.5) * 0.1);
        const jag = Math.sin(tS * 9 + i) * wBot * 0.02 + (rand() - 0.5) * wBot * 0.03;
        g.lineTo(lx(s.cx + half + jag), ly(yu + (rand() - 0.5) * 4));
      }
      // scalloped hem right to left
      for (let k = lobes; k >= 0; k--) {
        const tL = k / lobes;
        const half = wBot * 0.5 * (0.9 + rand() * 0.12);
        const px = s.cx + (tL - 0.5) * 2 * half;
        const dip = ((k % 2 === 0) ? 1 : 0.3) * (yBot - yTop) * 0.14 * rnd(0.65, 1.15);
        const ctrlX = px + half / lobes;
        if (k === lobes) g.lineTo(lx(px), ly(yBot - 4 + dip * 0.2));
        else g.quadraticCurveTo(lx(px + (0.5 / lobes) * wBot), ly(yBot + dip), lx(px), ly(yBot - 2));
      }
      // left slope back to tip
      for (let k = steps; k >= 1; k--) {
        const tS = k / steps;
        const yu = lerp(yTop, yBot, tS);
        const half = lerp(wTop * 0.15, wBot * 0.5, Math.pow(tS, 0.85)) * (1 + (rand() - 0.5) * 0.1);
        const jag = Math.sin(tS * 9 + i + 2) * wBot * 0.02 + (rand() - 0.5) * wBot * 0.03;
        g.lineTo(lx(s.cx - half - jag), ly(yu + (rand() - 0.5) * 4));
      }
      g.closePath();
      const fol = g.createLinearGradient(lx(s.cx - wBot / 2), ly(yTop), lx(s.cx + wBot / 2), ly(yBot));
      fol.addColorStop(0, '#1d6b38');
      fol.addColorStop(0.35, '#165a2e');
      fol.addColorStop(0.7, '#0f4a24');
      fol.addColorStop(1, '#0a3519');
      g.fillStyle = fol; g.fill();
      // inner shadow down the centre for depth
      const core = g.createLinearGradient(lx(s.cx), ly(yTop), lx(s.cx), ly(yBot));
      core.addColorStop(0, 'rgba(0,0,0,0)');
      core.addColorStop(0.45, 'rgba(8,30,14,0.22)');
      core.addColorStop(1, 'rgba(6,22,10,0.35)');
      g.fillStyle = core; g.fill();

      // needle sprigs along the slopes and hem
      const sprigs = 14 + i * 4;
      for (let n = 0; n < sprigs; n++) {
        const tS = n / sprigs;
        const side = n % 2 === 0 ? 1 : -1;
        const yu = lerp(yTop + 10, yBot - 6, Math.pow(rand(), 0.7));
        const uN = clamp((yu - s.top) / s.treeH, 0, 1);
        const half = firWidth(uN) * 0.46 * rnd(0.72, 1.02);
        const px = s.cx + side * half * (0.55 + rand() * 0.45);
        const py = yu + rnd(-3, 3);
        const ang = side > 0 ? rnd(-0.9, 0.4) : rnd(Math.PI - 0.4, Math.PI + 0.9);
        const needles = 4 + (rand() * 4) | 0;
        for (let d = 0; d < needles; d++) {
          const na = ang + rnd(-0.5, 0.5);
          const len = rnd(7, 16) * (0.7 + (1 - uN) * 0.4);
          const cols = ['#0d3d22', '#176b34', '#1f8a44', '#2c9b50', '#3eae62'];
          g.strokeStyle = cols[(d + (rand() * cols.length) | 0) % cols.length];
          g.lineWidth = 1 + rand() * 0.8;
          g.lineCap = 'round';
          g.beginPath();
          g.moveTo(lx(px), ly(py));
          g.lineTo(lx(px + Math.cos(na) * len), ly(py + Math.sin(na) * len * 0.85 + len * 0.15));
          g.stroke();
        }
      }
      // highlight clumps on the upper-left of the tier
      for (let n = 0; n < 5 + i; n++) {
        const tS = rand();
        const yu = lerp(yTop + 8, yBot - 10, tS);
        const half = firWidth(clamp((yu - s.top) / s.treeH, 0, 1)) * 0.35;
        const px = s.cx - half * rnd(0.1, 0.9);
        g.fillStyle = 'rgba(120, 200, 130, ' + rnd(0.06, 0.16) + ')';
        g.beginPath(); g.ellipse(lx(px), ly(yu), rnd(6, 14), rnd(3, 7), -0.4, 0, Math.PI * 2); g.fill();
      }
      // snow dusting on the upper surface
      const snowN = 6 + i * 2;
      for (let n = 0; n < snowN; n++) {
        const tS = n / (snowN - 1 || 1);
        const yu = yTop + (yBot - yTop) * (0.06 + tS * 0.22) + rnd(-2, 3);
        const half = firWidth(clamp((yu - s.top) / s.treeH, 0, 1)) * 0.42;
        const px = s.cx + (tS - 0.5) * 2 * half * rnd(0.7, 1);
        g.fillStyle = 'rgba(255,255,255,' + rnd(0.45, 0.85) + ')';
        g.beginPath(); g.ellipse(lx(px), ly(yu), rnd(4, 11), rnd(2.2, 4.5), rnd(-0.3, 0.3), 0, Math.PI * 2); g.fill();
      }
    }

    // a little extra snow on the lowest branches / skirt join
    for (let n = 0; n < 10; n++) {
      g.fillStyle = 'rgba(255,255,255,' + rnd(0.35, 0.7) + ')';
      g.beginPath();
      g.ellipse(lx(s.cx + rnd(-s.treeW * 0.4, s.treeW * 0.4)), ly(s.ground - s.trunkH - rnd(2, 18)), rnd(5, 12), rnd(2, 4), 0, 0, Math.PI * 2);
      g.fill();
    }

    // ---- draped string-light wires (baked); bulb anchors stored in scene space ----
    treeLights = [];
    const LIGHT_COLS = ['#ffe9b0', '#ffd36a', '#ffb347', '#ff7a5c', '#ffe0a0', '#fff4d0', '#ff9f43', '#ffd7a8'];
    const strands = 6;
    for (let st = 0; st < strands; st++) {
      const uA = 0.10 + st * 0.13, uB = uA + 0.07;
      const pts = [];
      const segs = 24;
      for (let i = 0; i <= segs; i++) {
        const tt = i / segs;
        const u = lerp(uA, uB, tt);
        const half = firWidth(u) * 0.46;
        const sag = Math.sin(tt * Math.PI) * s.treeH * 0.042;
        const x = s.cx + lerp(-half, half, tt) + Math.sin(tt * 6 + st) * 3;
        const y = tierY(u) + sag + s.treeH * 0.015;
        pts.push({ x, y });
      }
      g.strokeStyle = 'rgba(40, 28, 10, 0.55)';
      g.lineWidth = Math.max(1, s.treeW * 0.0035);
      g.beginPath();
      pts.forEach((pt, i) => i ? g.lineTo(lx(pt.x), ly(pt.y)) : g.moveTo(lx(pt.x), ly(pt.y)));
      g.stroke();
      const nL = 7 + (st % 3);
      for (let i = 0; i < nL; i++) {
        const tt = (i + 0.5) / nL;
        const idx = clamp(Math.round(tt * segs), 1, segs - 1);
        const pt = pts[idx];
        treeLights.push({
          x: pt.x, y: pt.y,
          col: LIGHT_COLS[(i * 3 + st * 2) % LIGHT_COLS.length],
          p1: rnd(0, 7), p2: rnd(0, 7), p3: rnd(0, 7), pS: rnd(0, 7),
          w1: rnd(1.1, 2.4), w2: rnd(3.5, 6.5), w3: rnd(7, 12), wS: rnd(0.35, 0.9)
        });
      }
    }

    treeStar = { x: s.cx, y: s.top + s.treeW * 0.015, r: s.treeW * 0.078 };
    treeBake = { canvas: c, originX, originY };
  }

  function drawBakedTree() {
    bakeTree();
    if (!treeBake) return;
    ctx.drawImage(treeBake.canvas, treeBake.originX, treeBake.originY, treeBake.canvas.width / DPR, treeBake.canvas.height / DPR);
  }

  function drawSparkleGlint(x, y, r, col, a, rot) {
    if (a <= 0.02) return;
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot || 0);
    ctx.globalAlpha = a;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.quadraticCurveTo(0, 0, r * 0.32, 0);
    ctx.quadraticCurveTo(0, 0, 0, r);
    ctx.quadraticCurveTo(0, 0, -r * 0.32, 0);
    ctx.quadraticCurveTo(0, 0, 0, -r);
    ctx.closePath(); ctx.fill();
    ctx.rotate(Math.PI / 2);
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.7);
    ctx.quadraticCurveTo(0, 0, r * 0.22, 0);
    ctx.quadraticCurveTo(0, 0, 0, r * 0.7);
    ctx.quadraticCurveTo(0, 0, -r * 0.22, 0);
    ctx.quadraticCurveTo(0, 0, 0, -r * 0.7);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawLightsAndStar(t) {
    if (!treeLights.length) return;
    const bulbR = Math.max(2.8, scene.treeW * 0.012);
    for (let i = 0; i < treeLights.length; i++) {
      const L = treeLights[i];
      const slow = 0.62 + 0.38 * Math.sin(t * L.w1 + L.p1);
      const flicker = 0.88 + 0.12 * Math.sin(t * L.w2 + L.p2) * Math.sin(t * L.w3 + L.p3);
      const spark = Math.pow(Math.max(0, Math.sin(t * L.wS + L.pS)), 22);
      const bright = clamp(slow * flicker + spark * 0.8, 0.2, 1.7);
      // soft halo (no shadowBlur)
      ctx.fillStyle = L.col;
      ctx.globalAlpha = 0.12 * bright;
      ctx.beginPath(); ctx.arc(L.x, L.y, bulbR * 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.22 * bright;
      ctx.beginPath(); ctx.arc(L.x, L.y, bulbR * 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = Math.min(1, 0.75 * bright);
      ctx.beginPath(); ctx.arc(L.x, L.y, bulbR, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fffdf4';
      ctx.globalAlpha = Math.min(1, 0.55 * bright);
      ctx.beginPath(); ctx.arc(L.x - bulbR * 0.25, L.y - bulbR * 0.28, bulbR * 0.4, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      if (spark > 0.35) drawSparkleGlint(L.x, L.y, bulbR * 3.2 * spark + 2, '#fff7d6', spark, t * 0.6 + L.pS);
    }
    // glowing top star + shimmer
    if (treeStar) {
      const S = treeStar, pulse = 0.75 + 0.25 * Math.sin(t * 2.1);
      ctx.fillStyle = 'rgba(255, 220, 90, ' + (0.16 * pulse) + ')';
      ctx.beginPath(); ctx.arc(S.x, S.y, S.r * 2.3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255, 240, 160, ' + (0.22 * pulse) + ')';
      ctx.beginPath(); ctx.arc(S.x, S.y, S.r * 1.45, 0, Math.PI * 2); ctx.fill();
      // rotating shimmer rays
      ctx.save();
      ctx.translate(S.x, S.y); ctx.rotate(t * 0.35);
      ctx.fillStyle = 'rgba(255, 248, 200, ' + (0.28 * pulse) + ')';
      for (let i = 0; i < 4; i++) {
        ctx.rotate(Math.PI / 4);
        ctx.beginPath(); ctx.moveTo(0, -S.r * 2.6); ctx.lineTo(S.r * 0.12, 0); ctx.lineTo(-S.r * 0.12, 0); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
      starPath(S.x, S.y, S.r, Math.sin(t * 0.35) * 0.06);
      const sg = ctx.createRadialGradient(S.x - S.r * 0.2, S.y - S.r * 0.25, 1, S.x, S.y, S.r);
      sg.addColorStop(0, '#fff6b0'); sg.addColorStop(0.45, '#ffd54a'); sg.addColorStop(1, '#e0a000');
      ctx.fillStyle = sg; ctx.fill();
      ctx.strokeStyle = 'rgba(255, 248, 200, 0.85)'; ctx.lineWidth = 1.2; ctx.stroke();
      // inner highlight
      starPath(S.x, S.y, S.r * 0.45, Math.sin(t * 0.35) * 0.06);
      ctx.fillStyle = 'rgba(255,255,240,' + (0.55 + 0.25 * pulse) + ')'; ctx.fill();
      const glint = Math.pow(Math.max(0, Math.sin(t * 0.8)), 10);
      if (glint > 0.2) drawSparkleGlint(S.x, S.y, S.r * 1.8 * glint + S.r * 0.4, '#fff', 0.4 + glint * 0.6, t);
    }
    // catch flash halo
    if (catchFlash > 0 && current && (current.phase === 'catch' || current.phase === 'carry')) {
      const h = bobHands(bob);
      ctx.fillStyle = 'rgba(255, 240, 160, ' + (0.28 * catchFlash) + ')';
      ctx.beginPath(); ctx.arc(h.x, h.y, 36 * catchFlash + 10, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawSparkles() {
    for (let i = 0; i < sparkles.length; i++) {
      const s = sparkles[i];
      drawSparkleGlint(s.x, s.y, s.r * s.life, s.color, s.life, s.rot);
    }
  }

  function drawPresent(p, nameAlpha) {
    if (p.hidden || p.alpha <= 0.01) return;
    const w = p.w * p.scale, h = p.h * p.scale;
    ctx.save();
    ctx.globalAlpha *= p.alpha;
    ctx.translate(p.x + (p.wobbleX || 0), p.y + (p.wobbleY || 0));
    ctx.rotate((p.rot || 0) + (p.wobbleR || 0));
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(0, h * 0.48, w * 0.48, h * 0.1, 0, 0, Math.PI * 2); ctx.fill();
    // box
    const x = -w / 2, y = -h / 2, r = Math.max(3, w * 0.1);
    rr(x, y, w, h, r);
    ctx.fillStyle = p.wrap.paper; ctx.fill();
    ctx.strokeStyle = p.wrap.edge; ctx.lineWidth = Math.max(1, w * 0.03); ctx.stroke();
    // lid highlight
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    rr(x + 2, y + 2, w - 4, h * 0.28, r * 0.6); ctx.fill();
    // ribbon cross
    const rw = Math.max(3, w * 0.14);
    ctx.fillStyle = p.wrap.ribbon;
    ctx.fillRect(-rw / 2, y, rw, h);
    ctx.fillRect(x, -rw * 0.42, w, rw * 0.84);
    // bow
    const by = y + rw * 0.1;
    ctx.beginPath();
    ctx.ellipse(-rw * 0.7, by, rw * 0.7, rw * 0.45, -0.4, 0, Math.PI * 2);
    ctx.ellipse(rw * 0.7, by, rw * 0.7, rw * 0.45, 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath(); ctx.arc(0, by, rw * 0.32, 0, Math.PI * 2); ctx.fill();
    // tag with gift icon
    const ts = Math.max(14, w * 0.42);
    const tx = w * 0.28, ty = -h * 0.08;
    ctx.fillStyle = '#fff8e8';
    rr(tx, ty, ts, ts, 3); ctx.fill();
    ctx.strokeStyle = 'rgba(80,50,20,0.35)'; ctx.lineWidth = 1; ctx.stroke();
    const icon = (p.img && p.img.complete && !p.img._bad && p.img.naturalWidth) ? p.img : emojiCanvas(p.emoji);
    if (icon) {
      const pad = ts * 0.12;
      ctx.drawImage(icon, tx + pad, ty + pad, ts - pad * 2, ts - pad * 2);
    }
    // name under the present (fades after a few seconds on settled gifts)
    if (NAMES && p.display && nameAlpha > 0.02) {
      const fs = Math.max(10, Math.min(16, w * 0.28));
      ctx.font = `700 ${fs}px "Trebuchet MS","Segoe UI",sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      const label = p.display.slice(0, 16);
      ctx.lineWidth = 3; ctx.strokeStyle = `rgba(20,20,30,${0.75 * nameAlpha})`;
      ctx.fillStyle = `rgba(255,255,255,${nameAlpha})`;
      ctx.strokeText(label, 0, h * 0.52 + 2);
      ctx.fillText(label, 0, h * 0.52 + 2);
    }
    ctx.restore();
  }

  function drawSantaHat(s) {
    // Snug hat on the crown, above the headphones and visor.
    // Drawn in full-body local space so it stays attached when the head tilts.
    const bandY = -s.h * 0.905;
    const bandW = s.w * 0.32;
    const bandH = Math.max(8, s.h * 0.036);
    const pomWiggle = (bob.pose && bob.pose.pom) || 0;
    ctx.save();
    ctx.translate(0, bandY);
    ctx.rotate(-0.12 + pomWiggle * 0.08 + ((bob.pose && bob.pose.hatTilt) || 0));
    const red = ctx.createLinearGradient(-bandW * 0.3, -bandH * 2.4, bandW * 0.5, bandH);
    red.addColorStop(0, '#e44545'); red.addColorStop(0.5, '#c41e1e'); red.addColorStop(1, '#8f1212');
    ctx.beginPath();
    ctx.moveTo(-bandW * 0.48, 0);
    ctx.bezierCurveTo(-bandW * 0.38, -bandH * 1.55, -bandW * 0.08, -bandH * 2.35, bandW * 0.12, -bandH * 2.15);
    ctx.bezierCurveTo(bandW * 0.40, -bandH * 1.7, bandW * 0.58, -bandH * 0.55, bandW * 0.66, bandH * 0.12);
    ctx.quadraticCurveTo(bandW * 0.40, bandH * 0.22, bandW * 0.48, 0);
    ctx.closePath();
    ctx.fillStyle = red; ctx.fill();
    ctx.strokeStyle = 'rgba(80,0,0,0.22)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-bandW * 0.12, -bandH * 0.35);
    ctx.quadraticCurveTo(bandW * 0.06, -bandH * 1.5, bandW * 0.2, -bandH * 1.85);
    ctx.strokeStyle = 'rgba(255,210,210,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
    // pom-pom, with a little extra wiggle on the tip
    const px = bandW * 0.66 + pomWiggle * bandW * 0.1, py = bandH * 0.12 + Math.abs(pomWiggle) * bandH * 0.12, pr = bandH * 0.55;
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.arc(px + 1, py + 1.6, pr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f4f1ea';
    ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(px - pr * 0.3, py - pr * 0.3, pr * 0.42, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e4e0d8';
    ctx.beginPath(); ctx.arc(px + pr * 0.22, py + pr * 0.18, pr * 0.28, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f4f1ea';
    rr(-bandW * 0.52, -bandH * 0.42, bandW * 1.04, bandH * 0.95, bandH * 0.45); ctx.fill();
    const puffs = 6;
    for (let i = 0; i < puffs; i++) {
      const u = i / (puffs - 1);
      const fx = lerp(-bandW * 0.48, bandW * 0.48, u);
      ctx.fillStyle = i % 2 ? '#fff' : '#efebe3';
      ctx.beginPath(); ctx.ellipse(fx, bandH * 0.08, bandH * 0.30, bandH * 0.36, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(fx, -bandH * 0.22, bandH * 0.26, bandH * 0.28, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawBob() {
    const s = bobSize();
    const P = bob.pose || {};
    const squash = P.squash || 1;
    const yOff = (bob.hop || 0) + (bob.bounce || 0) + (P.gaitHop || 0) + (P.idleBounce || 0);
    ctx.save();
    const shW = s.w * (0.28 + 0.1 * (P.crouch || 0));
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.ellipse(bob.x, scene.ground + 2, shW, 7, 0, 0, Math.PI * 2); ctx.fill();

    ctx.translate(bob.x, scene.ground - yOff);
    ctx.rotate(P.lean || 0);
    ctx.scale(bob.facing, 1);
    ctx.scale(1 + (1 - squash) * 0.45, squash);

    if (!(bobImg.complete && bobImg.naturalWidth)) {
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(0, -s.h * 0.78, s.w * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(-s.w * 0.22, -s.h * 0.6, s.w * 0.44, s.h * 0.55);
      drawSantaHat(s);
      ctx.restore();
      return;
    }

    const iw = bobImg.naturalWidth, ih = bobImg.naturalHeight;
    const hipY0 = -s.h * (1 - 500 / 708);
    const hipY = hipY0 * (1 - (P.crouch || 0) * 0.38);
    const neckY0 = -s.h * (1 - 208 / 708);
    const neckY = neckY0 + (hipY - hipY0);
    const breathe = (P.breathe || 0) * s.h * 0.01;
    const cycle = bob.walkT || 0;
    const amp = 0.36 * (P.walkOn || 0) * (1 - 0.75 * (P.crouch || 0));
    const lRot = Math.sin(cycle) * amp;
    const rRot = Math.sin(cycle + Math.PI) * amp;
    const stepLift = s.h * 0.036 * (P.walkOn || 0) * (1 - (P.crouch || 0));
    const lLift = Math.max(0, Math.cos(cycle)) * stepLift;
    const rLift = Math.max(0, -Math.cos(cycle)) * stepLift;
    const legScaleY = Math.abs(hipY / hipY0);

    function part(sx, sy, sw, sh, dx, dy) {
      const dw = s.w * (sw / iw), dh = s.h * (sh / ih);
      ctx.drawImage(bobImg, sx, sy, sw, sh, dx, dy, dw, dh);
    }
    function drawLeg(side) {
      const sx = side < 0 ? 0 : 216;
      const rot = side < 0 ? lRot : rRot;
      const lift = side < 0 ? lLift : rLift;
      ctx.save();
      ctx.translate(0, hipY);
      ctx.rotate(rot + (P.crouch || 0) * 0.12 * (side < 0 ? -1 : 1));
      ctx.scale(1, legScaleY);
      ctx.translate(0, -hipY0 - lift / Math.max(0.2, legScaleY));
      const dx = -s.w / 2 + (side < 0 ? 0 : s.w * (216 / 432));
      const dy = -s.h * (1 - 488 / 708);
      part(sx, 488, 216, 220, dx, dy);
      ctx.restore();
    }

    if (lRot <= rRot) drawLeg(-1); else drawLeg(1);

    // torso attached at the (possibly lowered) hip, slight lean-back when looking up
    ctx.save();
    ctx.translate(0, hipY);
    ctx.rotate((P.lookUp || 0) * -0.12);
    ctx.translate(0, -hipY0 + breathe);
    part(0, 200, 432, 300, -s.w / 2, -s.h * (1 - 200 / 708));
    ctx.restore();

    if (lRot <= rRot) drawLeg(1); else drawLeg(-1);

    // head + hat, pivoted at the neck so the hat stays on through every pose
    ctx.save();
    ctx.translate(0, neckY + breathe);
    ctx.rotate((P.headTilt || 0) * 0.40 + (P.lookUp || 0) * -0.32);
    ctx.translate(0, -neckY0);
    part(0, 0, 432, 214, -s.w / 2, -s.h);
    drawSantaHat(s);
    ctx.restore();

    ctx.restore();
  }

  function drawFlakes(dt, t) {
    ctx.fillStyle = '#fff';
    for (let i = 0; i < flakes.length; i++) {
      const f = flakes[i];
      f.y += f.v * dt * 0.045 / Math.max(1, H / 800);
      f.w += dt * 0.003;
      if (f.y > 1.04) { f.y = -0.02; f.x = Math.random(); }
      const px = f.x * W + Math.sin(f.w) * 10, py = f.y * H;
      ctx.globalAlpha = 0.7;
      ctx.beginPath(); ctx.arc(px, py, f.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawFloatNames(now) {
    if (!NAMES || !scene) return;
    const fs = Math.max(15, Math.min(28, W * 0.035));
    ctx.font = `700 ${fs}px "Trebuchet MS","Segoe UI",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = floatNames.length - 1; i >= 0; i--) {
      const n = floatNames[i], age = now - n.born;
      if (age > 2600) { floatNames.splice(i, 1); continue; }
      const a = age < 250 ? age / 250 : (age > 2000 ? 1 - (age - 2000) / 600 : 1);
      const y = Math.max(fs * 1.6, H * 0.13) - i * (fs + 10) - (age / 2600) * 18;
      ctx.globalAlpha = a;
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,20,30,0.8)'; ctx.fillStyle = '#fff';
      ctx.strokeText(n.text, scene.cx, y);
      ctx.fillText(n.text, scene.cx, y);
    }
    ctx.globalAlpha = 1;
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(33, now - last); last = now;
    if (scene) {
      updateAnim(dt);
      ctx.clearRect(0, 0, W, H);
      const t = now / 1000;
      drawFlakes(dt, t);
      drawBakedTree();
      drawLightsAndStar(t);
      // back-to-front presents (lower z first)
      const settled = placed.filter(p => !p.hidden).sort((a, b) => (a.z || 0) - (b.z || 0) || a.y - b.y);
      settled.forEach(p => {
        const age = Date.now() - p.born;
        const na = age < 5000 ? 1 : age < 7500 ? 1 - (age - 5000) / 2500 : 0;
        drawPresent(p, na);
      });
      // In-flight present is drawn after Bob so the mid-air catch and carry stay visible.
      drawBob();
      if (current && current.present && !current.present.settled) drawPresent(current.present, 1);
      drawSparkles();
      drawFloatNames(Date.now());
    }
    requestAnimationFrame(frame);
  }

  layout();
  addEventListener('resize', layout);
  requestAnimationFrame(frame);

  // ---- persistence (Studio reload keeps the pile; a new Live starts empty) ----
  let saveT = 0, ROOM = null, JSEQ = null;
  function save() {
    if (DEMO) return; clearTimeout(saveT);
    saveT = setTimeout(() => {
      try {
        localStorage.setItem(STORE, JSON.stringify({
          t: Date.now(), room: ROOM, jseq: JSEQ,
          items: placed.map(i => ({ img: i.url, giftName: i.giftName, diamonds: i.diamonds, display: i.display }))
        }));
      } catch (e) {}
    }, 1500);
  }
  function emptyTree(why) {
    placed.length = 0; queue.length = 0; current = null; floatNames.length = 0;
    try { localStorage.removeItem(STORE); } catch (e) {}
    console.log('xmas tree emptied:', why);
  }
  window.__emptyTree = emptyTree;
  function restore() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE) || 'null');
      if (!s || Date.now() - s.t > KEEP_MS) return;
      if (!s.room || (ROOM && s.room !== ROOM) || (JSEQ != null && s.jseq != null && s.jseq !== JSEQ)) {
        try { localStorage.removeItem(STORE); } catch (e) {}
        return;
      }
      (s.items || []).slice(-MAX).forEach(o => {
        const p = makePresent(o);
        p.settled = true; p.rot = (Math.random() - 0.5) * 0.12;
        placed.push(p);
      });
      reflowSlots();
    } catch (e) {}
  }

  // ---- demo / test burst (no live connection) ----
  if (DEMO) {
    const FAKE = [
      { giftName: 'Rose', diamonds: 1 },
      { giftName: 'TikTok', diamonds: 1 },
      { giftName: 'Heart Me', diamonds: 1 },
      { giftName: 'Galaxy', diamonds: 1000 },
      { giftName: 'Finger Heart', diamonds: 5 },
      { giftName: 'Doughnut', diamonds: 30 }
    ];
    const WHO = ['Rosie Test', 'Doughnut Donna', 'Big Spender', 'Hearty Hattie', 'Burst Barry', 'Disco Dave'];
    let k = 0;
    const rate = Math.max(50, +(q.get('rate') || 1400));
    const tick = () => {
      if (q.get('n') && k >= +q.get('n')) return;
      const g = FAKE[k % FAKE.length];
      drop({ ...g, display: WHO[k % WHO.length], count: k % 5 === 0 ? 3 : 1 });
      k++;
      if (!(q.get('n') && k >= +q.get('n'))) setTimeout(tick, rate);
    };
    setTimeout(tick, 280);
    window.__xmasTree = { demo: true, queue, placed, bob, get current() { return current; }, get idle() { return bob.idleName; }, homeX: bobHomeX, forceIdle };
    return;
  }

  // ---- live data: same stable box link as gift-jar.html (ngrok -> cors proxy -> tiktok-welcomer SSE)
  // GET /api/status and GET /api/jar/state only (no reset). Empty our pile on a new room id or jar seq change. ----
  const BOX = 'https://approach-grandkid-sermon.ngrok-free.dev', H_ = { 'ngrok-skip-browser-warning': '1' };
  const PATH = q.get('channel') === 'test' ? '/events?channel=test' : '/events';
  async function getJSON(u) { const r = await fetch(BOX + u, { headers: H_, cache: 'no-store' }); return r.json(); }
  async function boot() {
    try { const st = await getJSON('/api/status'); if (st && st.roomId) ROOM = String(st.roomId); } catch (e) {}
    try { const j = await getJSON('/api/jar/state'); if (j && j.seq != null) JSEQ = j.seq; } catch (e) {}
    restore();
  }
  async function watch() {
    try {
      const j = await getJSON('/api/jar/state');
      if (j && j.seq != null) { if (JSEQ != null && j.seq !== JSEQ) emptyTree('remote reset ' + j.seq); JSEQ = j.seq; }
    } catch (e) {}
    try {
      const st = await getJSON('/api/status');
      if (st && st.roomId && st.connected) {
        const r = String(st.roomId);
        if (ROOM && r !== ROOM) emptyTree('new live ' + r);
        if (r !== ROOM) { ROOM = r; save(); }
      }
    } catch (e) {}
  }

  let ctrl = null, lastData = Date.now(), running = false, sseOk = false, sseErr = null;
  async function run() {
    if (running) return; running = true; lastData = Date.now(); ctrl = new AbortController();
    try {
      const r = await fetch(BOX + PATH, { headers: Object.assign({ Accept: 'text/event-stream' }, H_), cache: 'no-store', signal: ctrl.signal });
      if (!r.ok || !r.body) throw new Error('status ' + r.status);
      sseOk = true; sseErr = null; console.log('xmas tree SSE connected', PATH);
      const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '';
      for (;;) {
        const { value, done } = await rd.read(); if (done) break;
        lastData = Date.now(); buf += dec.decode(value, { stream: true }).replace(/\r/g, '');
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
          const data = chunk.split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).replace(/^ /, '')).join('\n');
          if (data) { try { const d = JSON.parse(data); if (d && d.type === 'gift_drop') drop(d); } catch (e) {} }
        }
      }
    } catch (e) { sseErr = String(e && e.message || e); }
    try { ctrl.abort(); } catch (e) {}
    running = false; sseOk = false; setTimeout(run, 3000);
  }
  setInterval(() => { if (running && Date.now() - lastData > 45000) { try { ctrl.abort(); } catch (e) {} } }, 10000);
  window.__xmasTree = { demo: false, queue, placed, bob, get current() { return current; }, get idle() { return bob.idleName; }, homeX: bobHomeX, forceIdle, get sseOk() { return sseOk; }, get sseErr() { return sseErr; }, get room() { return ROOM; } };
  boot().then(() => { save(); setInterval(watch, 5000); watch(); });
  run();
})();
</script>
