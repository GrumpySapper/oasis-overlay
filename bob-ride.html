<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Oasis Radio – Bob rides across the top</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Bob rides across the top band using his transparent (VP9 alpha) video.
     Params: ?test=1 (ride now, then every 30s)  ?every=<min> (default 5)
             ?dur=<sec> crossing time (default 20)  ?flip=1 (mirror: ride left -> right)
     Old still-image version: bob-ride-still.html */
  :root { --h:20vh; --dur:20s; }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:transparent !important; }
  #ride { position:absolute; top:1.5vh; left:0; height:var(--h); visibility:hidden; pointer-events:none;
    will-change:transform; transform:translateX(100vw); }
  #ride.go { visibility:visible; animation: rideL var(--dur) linear forwards; }
  body.flip #ride { transform:translateX(-100%); }
  body.flip #ride.go { animation-name: rideR; }
  @keyframes rideL { from { transform:translateX(100vw); } to { transform:translateX(-100%); } }
  @keyframes rideR { from { transform:translateX(-100%); } to { transform:translateX(100vw); } }
  #bob { height:100%; width:auto; display:block; background:transparent;
    filter: drop-shadow(0 .6vh .5vh rgba(0,0,0,.45)) drop-shadow(0 0 1.2vh rgba(255,61,154,.3)); }
  body.flip #bob { transform:scaleX(-1); }
</style>
</head>
<body>
<div id="ride" aria-hidden="true">
  <video id="bob" src="images/bob-ride.webm?v=2" muted autoplay loop playsinline preload="auto" disablepictureinpicture></video>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var test  = q.get('test') === '1';
  var every = parseFloat(q.get('every')); if (!(every > 0)) every = 5;      // minutes
  var dur   = parseFloat(q.get('dur'));   if (!(dur > 0))   dur = 20;       // seconds per crossing
  var firstDelay = test ? 0 : 30;                                            // seconds
  var periodMs = test ? Math.max(30000, (dur + 5) * 1000) : every * 60000;
  if (q.get('flip') === '1') document.body.classList.add('flip');
  document.documentElement.style.setProperty('--dur', dur + 's');
  var el = document.getElementById('ride'), v = document.getElementById('bob');
  v.muted = true;
  el.addEventListener('animationend', function(e){ if (e.target === el) { el.classList.remove('go'); v.pause(); } });
  function ride(){
    el.classList.remove('go'); void el.offsetWidth;
    try { v.currentTime = 0; } catch(e) {}
    var p = v.play(); if (p && p.catch) p.catch(function(){});
    el.classList.add('go');
  }
  setTimeout(function(){ ride(); setInterval(ride, periodMs); }, firstDelay * 1000);
})();
</script>
</body>
</html>
