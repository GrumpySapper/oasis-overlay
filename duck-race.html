<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Oasis Radio Duck Race</title>
<!-- Oasis Radio DUCK RACE (3D little rubber ducks floating down a river) – 720x1280 Link source for TikTok LIVE Studio.
     Same entries/races/champs as Camel / Hover / Marble; Grumpy picks "Duck Race" in camel-control.html. Hidden unless picked.
     ?demo=1  offline DEMO with pretend ducks (no network, no live data touched)   ?n=8  ?seed=123  ?quality=low -->
<meta name="viewport" content="width=720,initial-scale=1">
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}#wrap{position:absolute;left:50%;top:50%;width:720px;height:1280px}#wrap canvas{position:absolute;left:0;top:0;width:720px;height:1280px;display:block}</style>
</head><body><div id="wrap"><canvas id="g3" width="720" height="1280"></canvas><canvas id="c" width="720" height="1280"></canvas></div>
<script src="duck-race-core.js?v=2"></script>
<script src="duck-race-3d.js?v=1"></script>
<script type="module">
// three.js r169 (same version/CDN as the Marble Run overlay). The offline demo build inlines it instead.
try { window.__DUCK_THREE = await import(window.__DUCK_THREE_URL || 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js'); }
catch (e) { window.__DUCK_THREE_ERR = '3D engine failed to load (' + String(e && e.message || e).slice(0, 60) + ')'; }
(() => {
  'use strict';
  const C = window.DuckCore, q = new URLSearchParams(location.search);
  const THREE = window.__DUCK_THREE || null, threeErr = window.__DUCK_THREE_ERR || null;
  const DEMO = q.get('demo') === '1', LOWQ = q.get('quality') === 'low';
  const VW = 720, VH = 1280, FONT = '"Montserrat","Arial Black",system-ui,sans-serif';
  const T = { accent: '#ff3d8b', accent2: '#00d9ff', accent3: '#ffd43b', gold: '#ffc83d', panel: 'rgba(30,20,90,.72)', line: 'rgba(255,255,255,.18)' };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
  const wrap = document.getElementById('wrap'), cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const RS = LOWQ ? 1 : Math.min(1.5, Math.max(1, devicePixelRatio || 1)); cv.width = VW * RS; cv.height = VH * RS;
  function fitWrap() { const s = Math.min(innerWidth / VW, innerHeight / VH); wrap.style.transform = `translate(-50%,-50%) scale(${s})`; } fitWrap(); addEventListener('resize', fitWrap);
  const fx = C.mulberry(777); // visual-only randomness
  function clip(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

  // ---------- avatars (same approach as the other race overlays) ----------
  const BOX = 'https://approach-grandkid-sermon.ngrok-free.dev', H_ = { 'ngrok-skip-browser-warning': '1' };
  const avatars = new Map();
  function loadAvatar(url) {
    let a = avatars.get(url);
    if (!a) { a = { img: null, ok: false }; avatars.set(url, a);
      const done = img => { a.img = img; a.ok = true; };
      const viaBox = () => { if (DEMO || !/^https:\/\//.test(url)) return;
        fetch(BOX + '/api/marble/avatar?u=' + encodeURIComponent(url), { headers: H_ }).then(r => { if (!r.ok) throw 0; return r.blob(); })
          .then(b => { if (!/^image\//.test(b.type)) throw 0; const i = new Image(); i.onload = () => done(i); i.src = URL.createObjectURL(b); }).catch(() => {}); };
      const i = new Image(); i.crossOrigin = 'anonymous'; i.referrerPolicy = 'no-referrer'; i.onload = () => done(i); i.onerror = viaBox; i.src = url; }
    return a.ok ? a.img : null;
  }
  function initials(n) { const w = String(n).replace(/^@/, '').split(/[\s_.]+/).filter(Boolean); return (((w[0] || '?')[0] || '?') + (w[1] ? w[1][0] : '')).toUpperCase(); }
  function avatarDisc(m, x, y, r, ring) {
    const img = m.avatar && !DEMO ? loadAvatar(m.avatar) : null, g = ctx;
    g.save(); g.beginPath(); g.arc(x, y, r, 0, 7); g.fillStyle = m.color || '#ffd43b'; g.fill();
    if (img) { g.save(); g.clip(); g.drawImage(img, x - r, y - r, r * 2, r * 2); g.restore(); }
    else { g.fillStyle = '#111'; g.font = `900 ${Math.round(r * .85)}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(initials(m.name), x, y + 1); }
    g.lineWidth = Math.max(2, r * .16); g.strokeStyle = ring || '#fff'; g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke(); g.restore();
  }

  function roundRect(x, y, w, h, r) { const g = ctx; g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
  function txt(s, x, y, size, col, o = {}) { const g = ctx; g.save(); g.font = `${o.w || 900} ${size}px ${FONT}`; g.textAlign = o.align || 'center'; g.textBaseline = 'middle'; g.lineWidth = Math.max(3, size / 6); g.strokeStyle = 'rgba(0,0,0,.6)'; g.strokeText(s, x, y); g.fillStyle = col || '#fff'; g.fillText(s, x, y); g.restore(); }

  // ---------- 3D scene (WebGL). If it can't start we say so on screen; the race logic keeps running either way ----------
  let R = null, err3d = null;
  try {
    if (!THREE) throw new Error(threeErr || '3D engine not loaded');
    R = window.Duck3D.create(THREE, document.getElementById('g3'), { D: C.D, lowq: LOWQ, dpr: RS });
  } catch (e) { err3d = String(e && e.message || e); R = null; }
  let rosterKeyNow = '';
  function syncDucks(list) { const k = list.map(m => m.id + ':' + (m.color || '')).join('|'); if (R && k !== rosterKeyNow) { rosterKeyNow = k; R.setDucks(list); } }
  // ---------- state ----------
  let MINC = 30, mode = 'idle', roster = [], sim = null, raceId = null, startAtLocal = 0, official = null, champs = [], skew = 0, finishShownAt = 0, lastState = null;
  const toasts = [];
  function toast(s, col) { toasts.push({ s, col: col || T.accent3, t: performance.now() }); if (toasts.length > 3) toasts.shift(); }
  const reportOnce = C.createReporter({
    post: DEMO ? async () => ({ status: 200, body: { demo: true } })
      : async body => { const r = await fetch(BOX + '/api/marble/result', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, H_), body: JSON.stringify(body) }); let j = null; try { j = await r.json(); } catch (e) {} return { status: r.status, body: j }; }
  });
  function applyState(st, ev) {
    if (!st) return; lastState = st;
    skew = (st.now || Date.now()) - Date.now(); champs = st.champs || []; if (st.minDiamonds) MINC = st.minDiamonds;
    const active = C.isActive(st, DEMO); document.body.style.visibility = active ? '' : 'hidden';
    const list = (st.marbles || []).map((m, i) => Object.assign({}, m, { idx: i }));
    if (!active || st.phase === 'idle') { mode = 'idle'; sim = null; official = null; roster = []; raceId = null; return; }
    if (st.phase === 'entries') { if (mode !== 'entries') { official = null; sim = null; raceId = null; } mode = 'entries'; const old = new Set(roster.map(r => r.id)); for (const m of list) if (!old.has(m.id) && roster.length) toast(`🦆 ${clip(m.name, 16)} joins the race!`); roster = list; return; }
    if (st.phase === 'countdown' || (st.phase === 'racing' && ev === 'start')) {
      if (raceId !== st.raceId) { raceId = st.raceId; roster = list; sim = C.simulate(roster, st.seed); startAtLocal = (st.startAt || Date.now()) - skew; mode = 'countdown'; official = null; }
      return;
    }
    if (st.phase === 'racing') { if (raceId !== st.raceId) { raceId = st.raceId; roster = list; sim = null; mode = 'inprogress'; } return; } // joined mid-race: can't replay, show holding card
    if (st.phase === 'finished') {
      if (st.results && st.results.length) { official = st.results; if (mode !== 'racing' && mode !== 'finish') mode = 'podium'; }
      else if (mode !== 'racing' && mode !== 'finish') mode = 'over';   // timed out without a result
    }
  }

  // ---------- HUD ----------
  function panel(x, y, w, h) { ctx.fillStyle = T.panel; roundRect(x, y, w, h, 18); ctx.fill(); ctx.strokeStyle = T.line; ctx.lineWidth = 2; ctx.stroke(); }
  function titleBar(sub) { panel(20, 18, VW - 40, 92); txt('🦆 OASIS RADIO DUCK RACE', VW / 2, 50, 32, T.accent3); txt(sub, VW / 2, 86, 20, '#fff', { w: 700 }); }
  function demoBadge() { if (!DEMO) return; ctx.save(); ctx.fillStyle = 'rgba(220,0,60,.85)'; roundRect(VW - 250, 122, 230, 44, 12); ctx.fill(); ctx.restore(); txt('DEMO – not live', VW - 135, 144, 22, '#fff'); }
  function entriesHud() {
    titleBar(`Send a ${MINC}+ coin gift to get your duck in the river!`);
    const n = roster.length; panel(60, 820, VW - 120, 120 + Math.min(n, 10) * 0); txt(n ? `${n} duck${n === 1 ? '' : 's'} on the start line` : 'Waiting for the first duck…', VW / 2, 860, 28, '#fff');
    txt('Gift Doughnut or bigger to enter 🍩', VW / 2, 900, 22, T.accent2, { w: 700 });
  }
  function nameTag(m, x, y, lead) { avatarDisc(m, x - 34, y, 16, lead ? T.gold : '#fff'); ctx.fillStyle = lead ? '#ff3d8b' : 'rgba(10,20,60,.85)'; roundRect(x - 14, y - 15, 128, 30, 12); ctx.fill(); ctx.strokeStyle = lead ? '#ffd43b' : '#fff'; ctx.lineWidth = 2; ctx.stroke(); txt(clip(m.name, 11), x + 50, y, 17, lead ? '#fff59d' : '#fff', { w: 900 }); }
  function board(t) {
    const rank = sim.ds.slice().sort((a, b) => C.yAt(b, t) - C.yAt(a, t)).slice(0, 5);
    panel(20, 1070, 340, 190); txt('LEADERS', 190, 1094, 20, T.accent3);
    rank.forEach((c, i) => { avatarDisc(c, 52, 1128 + i * 28, 12); txt(`${i + 1}. ${clip(c.name, 14)}`, 76, 1128 + i * 28, 18, i ? '#fff' : T.gold, { align: 'left', w: 800 }); });
  }
  function podium(list, sub) {
    titleBar(sub); const w = list.slice(0, 3);
    const pos = [[VW / 2, 470, 70], [VW / 2 - 200, 560, 54], [VW / 2 + 200, 600, 50]];
    w.forEach((r, i) => { const m = roster.find(x => x.id === r.id) || { id: r.id, name: r.name }; const [x, y, s] = pos[i];
      avatarDisc(m, x, y - 20, s * .7, i ? '#fff' : T.gold); txt(['🥇', '🥈', '🥉'][i] + ' ' + clip(r.name || m.name, 14), x, y + s + 70, i ? 22 : 30, i ? '#fff' : T.gold); });
    const champ = champs && champs.length ? champs.slice().sort((a, b) => b.wins - a.wins)[0] : null;
    if (champ) { panel(110, 900, VW - 220, 60); txt(`🏆 Top champ: ${clip(champ.name, 16)} – ${champ.wins} win${champ.wins === 1 ? '' : 's'}`, VW / 2, 930, 22, '#fff'); }
  }
  function drawToasts(now) { let y = 200; for (let i = toasts.length - 1; i >= 0; i--) { const k = toasts[i], a = now - k.t; if (a > 4000) { toasts.splice(i, 1); continue; } panel(110, y, VW - 220, 46); txt(k.s, VW / 2, y + 23, 20, k.col); y += 56; } }

  // ---------- frame ----------
  let lastNow = 0, prevY = new Map();
  function frame(now) {
    requestAnimationFrame(frame);
    const dtS = Math.min(.1, (now - (lastNow || now)) / 1000); lastNow = now;
    ctx.setTransform(RS, 0, 0, RS, 0, 0); ctx.clearRect(0, 0, VW, VH);
    const g3 = document.getElementById('g3'); g3.style.visibility = mode === 'idle' && !DEMO ? 'hidden' : '';
    if (mode === 'idle') { if (DEMO) { titleBar('DEMO starting…'); demoBadge(); } return; }
    const wall = Date.now(), t = (wall - startAtLocal) / 1000, tt = Math.max(0, t);
    let duckState = [], view = { mode: 'entries', t: tt }, lead = null;
    if ((mode === 'countdown' || mode === 'racing' || mode === 'finish') && sim) {
      if (mode === 'countdown' && t >= 0) mode = 'racing';
      syncDucks(roster);
      duckState = sim.ds.map(c => { const y = C.yAt(c, tt), e = C.eventAt(c, tt), sp = (y - C.yAt(c, Math.max(0, tt - .25))) / .25;
        return { id: c.id, p: y, moving: t > 0 && tt < (c.cross ?? 1e9) + 3, speed: sp, spin: e && e[0].type === 'spin' ? e[1] * 6.283 : 0 }; });
      lead = sim.ds.reduce((a, c) => C.yAt(c, tt) > C.yAt(a, tt) ? c : a, sim.ds[0]);
      view = { mode: 'race', t: tt };
    } else if (mode === 'entries') { syncDucks(roster); duckState = roster.map(m => ({ id: m.id, p: 0, moving: false, speed: 0 })); }
    else if ((mode === 'podium' || mode === 'podiumLocal') && sim) { syncDucks(roster); duckState = sim.ds.map(c => ({ id: c.id, p: C.yAt(c, 1e4), moving: false, speed: 0 })); view = { mode: 'podium', t: tt }; }
    let out = null;
    if (R) { try { out = R.frame(now, duckState, view); } catch (e) { err3d = String(e && e.message || e); R = null; } }
    if (!R) { ctx.fillStyle = '#0b8fd6'; ctx.fillRect(0, 0, VW, VH); panel(60, 520, VW - 120, 150); txt('3D view not available on this screen', VW / 2, 560, 26, '#fff'); txt(clip(err3d || 'WebGL unavailable', 46), VW / 2, 600, 18, T.accent3, { w: 700 }); txt('The race still runs and results still count.', VW / 2, 636, 18, '#fff', { w: 700 }); }
    // name tags + profile pictures over the 3D ducks
    if (out && duckState.length) {
      const byId = new Map(roster.map(m => [String(m.id), m])), many = duckState.length > 10;
      const ls = out.labels.filter(l => l.on).sort((a, b) => b.dist - a.dist);
      for (const l of ls) { const m = byId.get(String(l.id)); if (!m) continue; const isLead = lead && String(lead.id) === String(l.id);
        if (many && out.shot === 'wide' && !isLead) continue; nameTag(m, l.sx - 40, l.sy, isLead); }
    }
    if (mode === 'countdown' || mode === 'racing' || mode === 'finish') {
      titleBar(t < 0 ? 'Ducks at the ready…' : `Leading: ${clip(lead ? lead.name : '', 18)}`);
      if (t < 0) txt(String(Math.ceil(-t)), VW / 2, 560, 180, T.accent3);
      else if (t < 1.2) txt('QUACK! GO!', VW / 2, 560, 90, T.accent2);
      if (sim) board(tt);
      if (sim && tt >= sim.firstCross && mode !== 'finish') { mode = 'finish'; finishShownAt = now; toast(`🏁 ${clip(sim.order[0].name, 16)} wins!`, T.gold); reportOnce(raceId, sim.ids).then(r => { if (r && r.ok && r.body && r.body.state) applyState(r.body.state, 'result'); }); }
      if (mode === 'finish' && now - finishShownAt > Math.max(6000, (sim.lastCross - sim.firstCross) * 1000 + 2500)) mode = official ? 'podium' : 'podiumLocal';
    } else if (mode === 'podium') podium(official, 'Official result');
    else if (mode === 'podiumLocal') podium(sim ? sim.order.map(c => ({ id: c.id, name: c.name })) : [], 'Result (waiting for the box to confirm)');
    else if (mode === 'inprogress') titleBar('Race in progress – results coming up!');
    else if (mode === 'over') titleBar('Race ended without a result – Grumpy can re-run it');
    else if (mode === 'entries') entriesHud();
    drawToasts(now); demoBadge();
  }

  // ---------- DEMO: offline loop with pretend ducks, never touches the box ----------
  if (DEMO) {
    const n = clamp(+q.get('n') || 6, 1, 40), names = ['Allie Duck', 'Quackers', 'Sir Paddles', 'Bubbles', 'Captain Beak', 'Puddles', 'Waddles', 'Mr Splash', 'Dabbles', 'Ducky Mo'];
    const cols = ['#ff3d8b', '#00d9ff', '#9b5cff', '#3ddc84', '#ff8a3d', '#ffffff'];
    const ms = Array.from({ length: n }, (_, i) => ({ id: 'demo_' + i, name: names[i % names.length] + (i >= names.length ? ' ' + (i + 1) : ''), color: cols[i % cols.length], avatar: null }));
    let seed = +q.get('seed') || 123, k = 0;
    const cycle = () => { const base = { game: 'duck', now: Date.now(), minDiamonds: 30, champs: [] };
      applyState(Object.assign({}, base, { phase: 'entries', marbles: [] }), 'open');
      ms.forEach((m, i) => setTimeout(() => applyState(Object.assign({}, base, { now: Date.now(), phase: 'entries', marbles: ms.slice(0, i + 1) }), 'join'), 600 + i * 400));
      setTimeout(() => { const id = 'demo-' + (++k); applyState(Object.assign({}, base, { now: Date.now(), phase: 'countdown', raceId: id, seed: seed + k, startAt: Date.now() + 4000, marbles: ms }), 'countdown');
        const s = C.simulate(ms, seed + k); setTimeout(cycle, (s.lastCross + 16) * 1000 + 4000); }, 1000 + n * 400 + 3000); };
    cycle(); requestAnimationFrame(frame); return;
  }

  // ---------- live data (same box link + shared race state as the other race games) ----------
  const getState = () => fetch(BOX + '/api/marble/state', { headers: H_, cache: 'no-store' }).then(r => r.json()).then(st => applyState(st, 'init')).catch(() => {});
  getState();
  let ctrl = null, lastData = Date.now(), running = false;
  async function run() {
    if (running) return; running = true; lastData = Date.now(); ctrl = new AbortController();
    try {
      const r = await fetch(BOX + '/events', { headers: Object.assign({ Accept: 'text/event-stream' }, H_), cache: 'no-store', signal: ctrl.signal });
      if (!r.ok || !r.body) throw new Error('status ' + r.status);
      getState();
      const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '';
      for (;;) {
        const { value, done } = await rd.read(); if (done) break;
        lastData = Date.now(); buf += dec.decode(value, { stream: true }).replace(/\r/g, '');
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
          const data = chunk.split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).replace(/^ /, '')).join('\n');
          if (data) { try { const d = JSON.parse(data); if (d && d.type === 'marble') { if (d.ev === 'cheer') { if (C.isActive(lastState)) toast(`${clip(d.name || 'Someone', 16)} cheers on their duck! 🦆`, T.accent2); } else applyState(d.state, d.ev); } } catch (e) {} }
        }
      }
    } catch (e) {}
    try { ctrl.abort(); } catch (e) {}
    running = false; setTimeout(run, 3000);
  }
  setInterval(() => { if (running && Date.now() - lastData > 45000) { try { ctrl.abort(); } catch (e) {} } }, 10000);
  setInterval(() => { if (['idle', 'entries', 'over', 'podium', 'podiumLocal', 'inprogress'].includes(mode)) getState(); }, 15000);
  run(); requestAnimationFrame(frame);
})();
</script></body></html>
