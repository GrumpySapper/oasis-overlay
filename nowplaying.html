<html><head><meta charset="utf-8"><title>Oasis Radio - Now Playing</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;font-family:Montserrat,'Segoe UI',Arial,sans-serif}
  body.preview{background:linear-gradient(135deg,#1b1b2f,#3a3a5a);min-height:100vh}
</style></head>

<script>/* Bob's NOW PLAYING card. Used by overlay.html and nowplaying.html.
   URL options: ?np=off (hide)  ?np=always (keep full card)  ?npMs=12000 (full-card time)  ?npBottom=2 (vh from bottom)  ?npLeft=2.5 (vw from left) */
(function () {
  const P = new URLSearchParams(location.search);
  const MODE = (P.get('np') || 'auto').toLowerCase();          // auto | always | off

  const BOTTOM_VH = +(P.get('npBottom') || 2), LEFT_VW = +(P.get('npLeft') || 2.5);

  #np{position:fixed;left:${LEFT_VW}vw;bottom:${BOTTOM_VH}vh;z-index:5;pointer-events:none;font-family:Montserrat,'Segoe UI',Arial,sans-serif;
    transition:bottom .35s ease,opacity .45s ease,transform .45s cubic-bezier(.2,1.4,.4,1);max-width:min(46vw,540px)}
  #np.hidden{opacity:0;transform:translateX(-40px)}
  #np .box{display:flex;align-items:center;gap:14px;color:#fff;border-radius:16px;padding:12px 20px 12px 14px;
    background:linear-gradient(135deg,rgba(18,10,40,.93),rgba(40,8,60,.93));
    box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 24px rgba(255,0,170,.55),0 0 40px rgba(0,229,255,.25),0 10px 28px rgba(0,0,0,.45);
    border-left:8px solid #ff2d95;transition:padding .4s ease,border-radius .4s ease,gap .4s ease}
  #np .disc{position:relative;flex:0 0 auto;width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    perspective:300px;transition:width .4s ease,height .4s ease}
  #np .disc::before{content:'';position:absolute;inset:-3px;border-radius:50%;
    background:conic-gradient(from 0deg,#00e5ff,#ff2d95,#fff7a8,#00e5ff);animation:npspin 3.5s linear infinite;
    box-shadow:0 0 14px rgba(0,229,255,.65),0 0 22px rgba(255,45,149,.45)}
  #np .disc::after{content:'';position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 50% 40%,#3a1f63 0,#1a0c33 62%,#0d0620 100%);box-shadow:inset 0 0 10px rgba(0,0,0,.6)}
  #np .disc img{position:relative;z-index:1;width:88%;height:auto;display:block;
    filter:drop-shadow(0 0 3px rgba(255,255,255,.35)) drop-shadow(0 1px 2px rgba(0,0,0,.6));
    will-change:transform;animation:nprecord 4s linear infinite!important}
  @keyframes npspin{to{transform:rotate(360deg)}}
  @keyframes nprecord{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  #np .meta{min-width:0;display:flex;flex-direction:column}
  #np .lbl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:.22em;color:#00e5ff;text-transform:uppercase;
    text-shadow:0 0 8px rgba(0,229,255,.8);transition:font-size .4s ease}
  #np .eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
  #np .eq i{display:block;width:3px;background:#ff2d95;animation:npeq .9s ease-in-out infinite;box-shadow:0 0 4px #ff2d95}
  #np .eq i:nth-child(2){animation-delay:-.3s}#np .eq i:nth-child(3){animation-delay:-.6s}#np .eq i:nth-child(4){animation-delay:-.15s}
  @keyframes npeq{0%,100%{height:3px}50%{height:12px}}
  #np .song{font-size:26px;font-weight:800;line-height:1.15;margin-top:3px;text-shadow:0 2px 4px rgba(0,0,0,.5);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;transition:font-size .4s ease}
  #np .artist{font-size:19px;font-weight:600;color:#fff7a8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:font-size .4s ease}
  /* small persistent strip */
  #np.strip .box{padding:6px 14px 6px 8px;border-radius:12px;gap:9px;border-left-width:5px}
  #np.strip .disc{width:38px;height:38px}
  #np.strip .disc::before{inset:-2px}
  #np.strip .lbl{display:none}
  #np.strip .meta{flex-direction:row;align-items:baseline;gap:8px;white-space:nowrap}
  #np.strip .song{font-size:16px;margin:0;-webkit-line-clamp:1;display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;max-width:24vw}
  #np.strip .artist{font-size:14px;margin:0;max-width:16vw}
  #np.strip .artist:not(:empty)::before{content:'· ';color:#ff2d95}
  #np.pop .box{animation:nppop .6s ease}
  @keyframes nppop{0%{transform:scale(.85)}60%{transform:scale(1.04)}100%{transform:none}}`;

<script>/* Oasis overlay data bus: stable box link via ngrok (header skips the ngrok warning page) + ntfy.sh relay for Now Playing. */
window.OasisBus = (function () {
  const BOX = 'https://approach-grandkid-sermon.ngrok-free.dev', TOPIC = 'oasisradio-np-67c6ab132bb28b1d2d0df0be', H = { 'ngrok-skip-browser-warning': '1' };
  function api(path) { return fetch(BOX + path, { headers: H, cache: 'no-store' }).then(r => r.json()); }
  // SSE over fetch (EventSource can't send the header). Auto-reconnects forever; watchdog kills stalled streams.
  function boxStream(path, onEvent, onState) {
    let ctrl = null, last = Date.now(), running = false, since = 0;
    async function run() {
      if (running) return; running = true; last = Date.now();
      ctrl = new AbortController();
      try {
        const r = await fetch(BOX + path, { headers: Object.assign({ Accept: 'text/event-stream' }, H), cache: 'no-store', signal: ctrl.signal });
        if (!r.ok || !r.body) throw new Error('status ' + r.status);
        since = Date.now(); onState && onState(true, since);
        const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '';
        for (;;) {
          const { value, done } = await rd.read(); if (done) break;
          last = Date.now(); buf += dec.decode(value, { stream: true }).replace(/\r/g, '');
          let i;
          while ((i = buf.indexOf('\n\n')) >= 0) {
            const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
            const data = chunk.split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).replace(/^ /, '')).join('\n');
            if (data) { try { const d = JSON.parse(data); if (d && d.type !== 'ping') onEvent(d); } catch (e) {} }
          }
        }
      } catch (e) {}
      try { ctrl.abort(); } catch (e) {}
      running = false; onState && onState(false, 0);
      setTimeout(run, 3000);
    }
    setInterval(() => { if (running && Date.now() - last > 45000) { try { ctrl.abort(); } catch (e) {} } }, 10000);
    run();
    return { connectedSince: () => since };
  }
  // ntfy.sh: messages are JSON strings we published. Initial = last cached message.
  function ntfy(onEvent) {
    const parse = m => { try { if (m && m.event === 'message' && m.message) { const d = JSON.parse(m.message); d._t = m.time * 1000; onEvent(d); } } catch (e) {} };
    fetch('https://ntfy.sh/' + TOPIC + '/json?poll=1&since=12h', { cache: 'no-store' }).then(r => r.text()).then(t => {
      const lines = t.trim().split('\n').filter(Boolean); if (lines.length) { try { const m = JSON.parse(lines[lines.length - 1]); m._initial = true; parse(m); } catch (e) {} }
    }).catch(() => {});
    let es = null, last = Date.now();
    const connect = () => {
      try { if (es) es.close(); } catch (e) {}
      last = Date.now();
      es = new EventSource('https://ntfy.sh/' + TOPIC + '/sse');
      es.onmessage = e => { last = Date.now(); try { parse(JSON.parse(e.data)); } catch (x) {} };
      es.addEventListener('keepalive', () => { last = Date.now(); });
      es.onopen = () => { last = Date.now(); };
    };
    connect();
    setInterval(() => { if (!es || es.readyState === 2 || Date.now() - last > 120000) connect(); }, 15000);
  }
  return { BOX, TOPIC, api, boxStream, ntfy };
})();
</script>
<script>
const params = new URLSearchParams(location.search);
if (params.get('bg') === '1') document.body.classList.add('preview');
const handle = d => { if (d && d.type === 'nowplaying') NowPlaying.handle(d); };
if (params.get('nptest')) { const [a,t] = params.get('nptest').split('|'); setTimeout(()=>handle({type:'nowplaying', artist:t?a:'', title:t||a}), 300); }
else {
  let gotLive = false;
  // 1) ntfy relay (straight from Grumpy's browser extension, works even when Bob's computer naps)
  OasisBus.ntfy(d => {
    if (d.type !== 'nowplaying' || !d.title) return;
    if (d._initial) { if (gotLive || Date.now() - d._t > 10 * 60 * 1000) return; d.initial = true; }
    else gotLive = true;
    handle(d);
  });
  // 2) Bob's computer (stable link), also carries "music stopped"
  OasisBus.api('/api/nowplaying').then(d => { if (d.title && !gotLive) handle({ type: 'nowplaying', initial: true, ...d }); }).catch(() => {});
  const box = OasisBus.boxStream('/events', d => {
    if (d.type !== 'nowplaying') return;
    if (!d.title) { const s = box.connectedSince(); if (!s || Date.now() - s < 60000) return; }   // ignore "stopped" right after a reconnect
    if (d.initial && gotLive) return;
    handle(d);
  });
}
