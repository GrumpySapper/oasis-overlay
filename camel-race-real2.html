    txt(w.name, 0, 318, fit(w.name, 540, 40), '#1b1630', { shadow: false }); txt(line, 0, 358, 26, '#e0306f', { w: 800, shadow: false });
    ctx.restore();
  }
  function drawPodiumHud(t, now) {
    const list = official || (sim ? sim.order.map(c => ({ id: c.id, name: c.name })) : []); if (!list[0]) return;
    const k = mode === 'podiumOnly' ? 1 : clamp((now - podiumAt) / 700, 0, 1), sc = .7 + .3 * ease(k);
    ctx.save(); ctx.globalAlpha = k; txt('WINNER!', 360, 186, Math.round(86 * sc), '#fff', { grad: ['#fff6cf', '#ffb13d'], stroke: 8 });
    txt(list[0].name, 360, 266, Math.round(fit(list[0].name, 640, 56) * sc), '#fff', { stroke: 7 });
    txt('Bragging rights for the night!', 360, 320, 25, '#fff', { w: 800, stroke: 5 }); ctx.restore();
    // names over the podium camels
    podTags.forEach(o => nameTag(o.m, o.x, o.y - 26, o.lead ? 24 : 19, o.lead));
    champsPanel(960);
  }
  function credit() { ctx.save(); ctx.font = `600 10px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.textAlign = 'right'; ctx.fillText('Broadcast Edition', 712, 1272); ctx.restore(); }
  function grab(type) { const c = document.createElement('canvas'); c.width = gv.width; c.height = gv.height; const g = c.getContext('2d'); g.drawImage(gv, 0, 0); g.drawImage(cv, 0, 0); return type === 'png' ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', .92); }
  const fpsS = { n: 0, t0: performance.now(), fps: 60 };
  let lastPerf = 0, lastKey = '', podAt = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(.05, lastPerf ? (now - lastPerf) / 1000 : 1 / 60); lastPerf = now; const t = now / 1000;
    fpsS.n++; if (now - fpsS.t0 >= 1000) { fpsS.fps = fpsS.n * 1000 / (now - fpsS.t0); fpsS.n = 0; fpsS.t0 = now; }
    const wall = Date.now();
    if (sim && mode === 'countdown' && wall >= startAtLocal) { mode = 'racing'; raceT = Math.min(3, (wall - startAtLocal) / 1000); toast("AND THEY'RE OFF!", T.accent2); }
    if (sim && (mode === 'racing' || mode === 'photo' || mode === 'finished')) {
      const lead = sim.order[0]; let lx = 0; for (const c of sim.cs) lx = Math.max(lx, xAt(c, raceT));
      const target = (mode === 'racing' && lx > D - 260 && raceT < lead.cross + .3) ? .3 : 1;
      slow += (target - slow) * Math.min(1, dt * 6); raceT += dt * slow;
      if (mode === 'racing' && raceT >= lead.cross + .04) { mode = 'photo'; photoAt = now; flashAt = now; photo = 'pending'; }
      if (mode === 'photo' && now - photoAt > 3600) { mode = 'finished'; podiumAt = now; burstConfetti(LOWQ ? 80 : 180); report(); }
    }
    const live = sim && mode !== 'countdown';
    const cs = (mode === 'idle' || mode === 'inprogress' || mode === 'over' || mode === 'podiumOnly') ? [] : sim ? sim.cs : roster;
    const pos = new Map(); for (const c of cs) pos.set(c.id, live ? xAt(c, raceT) : 0);
    let leadX = -1, curLeader = null; for (const c of cs) { const x = pos.get(c.id); if (!curLeader || x > leadX) { leadX = x; curLeader = c; } }
    if (live) { const crossed = sim.order.filter(c => c.cross !== null && c.cross <= raceT); if (crossed.length) curLeader = crossed[0];
      if (raceT > 1.5 && curLeader && curLeader.id !== leaderId) { if (leaderId && mode === 'racing') toast(`${clip(curLeader.name, 18)} takes the lead!`, T.gold); leaderId = curLeader.id; } }
    if (live) for (const c of cs) { const [e] = eventAt(c, raceT); if (e) { const key2 = c.id + '|' + e.t0; if (!seenEv.has(key2)) { seenEv.add(key2); if (mode === 'racing' && e.type === 'burst') toast(`${clip(c.name, 16)} finds another gear!`, T.accent2, true); } } }
    stepToasts(now); direct(now, cs, pos);
    window.__camel = { vis: camelsShown.map(o => [Math.round(360 + (o.x - 360) * Math.max(1, cam.z)), Math.round(cam.fy + (o.y - cam.fy) * Math.max(1, cam.z))]), mode, raceT, slow, grab, shot: cam.shot, cpos: [cam.x, cam.z], winner: sim && sim.order[0] ? sim.order[0].name : null, fps: fpsS.fps, scale: RS };
    if (window.__camelSkip) return;
    if (mode === 'finished' || mode === 'podiumOnly') { if ((mode === 'podiumOnly') && !podAt) { podAt = now; burstConfetti(120); } if (fx() < .05) burstConfetti(8); drawPodiumWorld(t, dt); } else { podAt = 0; drawWorld(t, dt, cs, pos, curLeader); }
    if (photo === 'pending') { const sz = Math.round(gv.width * .8); photoC = document.createElement('canvas'); photoC.width = photoC.height = sz; const g = photoC.getContext('2d');
      const w = camelsShown.find(o => o.c.id === sim.order[0].id), z = Math.max(1, cam.z); let cx = gv.width / 2, cy = gv.height * .7; if (w) { cx = clamp((360 + (w.x - 360) * z) * RS, sz / 2, gv.width - sz / 2); cy = clamp((cam.fy + (w.y - cam.fy) * z + 120) * RS, sz / 2, gv.height - sz / 2); }
      try { g.drawImage(gv, cx - sz / 2, cy - sz / 2, sz, sz, 0, 0, sz, sz); } catch (e) {} photo = 'ready'; }
    ctx.setTransform(RS, 0, 0, RS, 0, 0); ctx.clearRect(0, 0, VW, VH);
    drawHud(t, now, cs, pos, curLeader);
    if (now - flashAt < 450) { ctx.save(); ctx.fillStyle = `rgba(255,255,255,${.9 * (1 - (now - flashAt) / 450)})`; ctx.fillRect(0, 0, VW, VH); ctx.restore(); }
    drawToasts(now);
    if (SHOWFPS) { ctx.fillStyle = '#0f0'; ctx.font = '700 18px monospace'; ctx.textAlign = 'left'; ctx.fillText(`${fpsS.fps.toFixed(0)} fps x${RS}`, 10, VH - 10); }
    window.__c3dOK = true;
  }

  // ---------- test mode: pretend names, cartoon placeholder faces, endless races ----------
  const FAKE = ['Neon Nina', 'Cassette Kev', 'Rubik Rita', 'Walkman Wayne', 'Synth Sue', 'Arcade Andy', 'Mixtape Mia', 'Boombox Barry', 'Leg-Warmer Liz', 'Pac-Man Pete', 'Big Hair Brenda', 'Atari Annie'];
  const COLORS = ['#ff2bd6', '#00f0ff', '#ffe600', '#a74bff', '#39ff14', '#ff7a00', '#ff3860', '#3d7bff', '#ffffff', '#00ffa8', '#ff9cf0', '#c6ff00'];
  let testSt = null, testChamps = {};
  function testState(phase, extra) { testSt = Object.assign({ now: Date.now(), phase, champs: Object.entries(testChamps).map(([id, c]) => ({ id, name: c.name, wins: c.wins })).sort((a, b) => b.wins - a.wins), auto: { on: false, minutes: 3 } }, testSt && { marbles: testSt.marbles, raceId: testSt.raceId, seed: testSt.seed, startAt: testSt.startAt, openedAt: testSt.openedAt }, extra || {}); return testSt; }
  function testLoop() {
    const n = +(q.get('n') || 8);
    testSt = null; applyState(testState('entries', { marbles: [], openedAt: Date.now() }), 'open');
    let i = 0; const iv = setInterval(() => { if (i >= Math.min(n, 40)) { clearInterval(iv); setTimeout(() => applyState(testState('countdown', { raceId: 'test' + Date.now(), seed: q.get('seed') ? +q.get('seed') : (Math.random() * 4e9) >>> 0, startAt: Date.now() + 4000 }), 'start'), +(q.get('hold') || 1500)); return; }
      const nm = FAKE[i % FAKE.length] + (i >= FAKE.length ? ' ' + (1 + Math.floor(i / FAKE.length)) : ''), m = { id: 't' + i, name: nm, color: COLORS[i % COLORS.length], avatar: null, fake: true }; i++;
      applyState(testState('entries', { marbles: (testSt.marbles || []).concat(m) }), 'join', { marble: m });
    }, +(q.get('joinms') || 400));
  }
  function testFinish(order) {
    const w = sim.cs.find(m => m.id === order[0]); const c = testChamps[w.id] || { name: w.name, wins: 0 }; c.wins++; testChamps[w.id] = c;
    applyState(testState('finished', { results: order.map((id, i) => ({ place: i + 1, id, name: sim.cs.find(m => m.id === id).name })) }), 'result');
    if (q.get('loop') !== '0') setTimeout(testLoop, +(q.get('pause') || 14000));
  }
  window.__camelSim = simulate;
  if (TEST) { testLoop(); requestAnimationFrame(frame); return; }

  // ---------- live data (same box link + state as the marble race) ----------
  const PATH = q.get('channel') === 'test' ? '/events?channel=test' : '/events';
  const getState = () => fetch(BOX + '/api/marble/state', { headers: H_, cache: 'no-store' }).then(r => r.json()).then(st => applyState(st, 'init')).catch(() => {});
  getState();
  let ctrl = null, lastData = Date.now(), running = false;
  async function run() {
    if (running) return; running = true; lastData = Date.now(); ctrl = new AbortController();
    try {
      const r = await fetch(BOX + PATH, { headers: Object.assign({ Accept: 'text/event-stream' }, H_), cache: 'no-store', signal: ctrl.signal });
      if (!r.ok || !r.body) throw new Error('status ' + r.status);
      getState();
      const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '';
      for (;;) {
        const { value, done } = await rd.read(); if (done) break;
        lastData = Date.now(); buf += dec.decode(value, { stream: true }).replace(/\r/g, '');
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
          const data = chunk.split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).replace(/^ /, '')).join('\n');
          if (data) { try { const d = JSON.parse(data); if (d && d.type === 'marble') { if (d.ev === 'cheer') toast(`${clip(d.name || 'Someone', 18)} cheers their camel on!`, T.accent2); else applyState(d.state, d.ev, d); } } catch (e) {} }
        }
      }
    } catch (e) {}
    try { ctrl.abort(); } catch (e) {}
    running = false; setTimeout(run, 3000);
  }
  setInterval(() => { if (running && Date.now() - lastData > 45000) { try { ctrl.abort(); } catch (e) {} } }, 10000);
  setInterval(() => { if (mode === 'idle' || mode === 'entries' || mode === 'over' || mode === 'podiumOnly' || mode === 'finished') getState(); }, 15000);
  run();
  requestAnimationFrame(frame);
})();
