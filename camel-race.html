    for (const c of ord) avatarDisc(ctx, c, bx + bw * clamp(pos.get(c.id) / D, 0, 1), by, c === curLeader ? 16 : 13, c === curLeader ? T.gold : c.color);
    const crossed = sim.order.filter(c => c.cross !== null && c.cross <= raceT);
    const st = crossed.concat(cs.filter(c => !crossed.includes(c)).sort((a, b) => pos.get(b.id) - pos.get(a.id))).slice(0, 5);
    panel(448, 160, 262, 20 + st.length * 42, T.accent2);
    st.forEach((c, i) => { const y = 183 + i * 42; avatarDisc(ctx, c, 478, y, 16, i === 0 ? T.gold : c.color); ctx.font = `800 20px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = i === 0 ? T.gold : '#fff'; ctx.fillText(`${i + 1}. ${clip(c.name, 11)}`, 502, y + 1); });
    if (mode === 'racing') { ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.55)'; rr(ctx, 12, 158, 128, 42, 21); ctx.fill(); ctx.restore(); glowText(ctx, `${raceT.toFixed(1)}s`, 76, 180, 26, '#fff', T.accent2, 'center', false); }
    if (slow < .7 && mode === 'racing') glowText(ctx, 'PHOTO FINISH?!', 300, 430, Math.round(54 + Math.sin(t * 10) * 4), T.gold, T.accent);
    if (mode === 'racing' && raceT < 1.6) glowText(ctx, 'GO!', 300, 380, Math.round(200 - raceT * 30), T.accent3, T.accent);
  }
  function drawPhoto(now) {
    const k = clamp((now - photoAt - 250) / 450, 0, 1), out = mode === 'finished' ? clamp((now - podiumAt) / 700, 0, 1) : 0;
    if (k <= 0) return;
    const w = sim.order[0], second = sim.order[1], gap = second && second.cross !== null ? second.cross - w.cross : 9;
    ctx.save(); ctx.globalAlpha = 1 - out; ctx.fillStyle = `rgba(0,0,0,${.5 * k})`; ctx.fillRect(0, 0, VW, VH);
    ctx.translate(360, 640); ctx.rotate(-.05 * ease(k)); const sc = lerp(1.5, 1, ease(k)); ctx.scale(sc, sc);
    ctx.fillStyle = '#fffdf4'; if (!LOWQ) { ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 30; } ctx.fillRect(-300, -340, 600, 720); ctx.shadowBlur = 0;
    if (photoC) { ctx.drawImage(photoC, -280, -280, 560, 560); ctx.fillStyle = 'rgba(255,190,110,.1)'; ctx.fillRect(-280, -280, 560, 560); ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.strokeRect(-280, -280, 560, 560); }
    glowText(ctx, 'PHOTO FINISH!', 0, -308, 48, T.gold, T.accent, 'center', false);
    const line = gap < .25 ? 'wins by a whisker!' : gap < .8 ? 'wins by a nose!' : gap < 2 ? 'wins by a hump!' : 'wins by a mile!';
    ctx.fillStyle = '#222'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `900 ${fit(w.name, 540, 40)}px ${FONT}`; ctx.fillText(w.name, 0, 316); ctx.font = `800 28px ${FONT}`; ctx.fillStyle = '#c0306a'; ctx.fillText(line, 0, 356);
    ctx.restore();
  }
  function drawPodium(t, now) {
    const list = official || (sim ? sim.order.map(c => ({ id: c.id, name: c.name })) : []);
    const byId = new Map((sim ? sim.cs : roster).map(c => [c.id, c]));
    const top = list.slice(0, 3).map((r, i) => byId.get(r.id) || { id: r.id, name: r.name, color: '#fff', idx: i });
    const k = mode === 'podiumOnly' ? 1 : clamp((now - podiumAt) / 700, 0, 1);
    ctx.save(); ctx.fillStyle = `rgba(0,0,0,${.74 * k})`; ctx.fillRect(0, 96, VW, VH); ctx.restore();
    if (!top[0]) return;
    glowText(ctx, 'WINNER!', 360, 180, Math.round(84 * (.6 + .4 * k)), T.gold, T.accent);
    glowText(ctx, top[0].name, 360, 262, Math.round(fit(top[0].name, 640, 58) * (.6 + .4 * k)), '#fff', T.accent2);
    glowText(ctx, 'Bragging rights for the night!', 360, 322, 26, T.accent3, T.accent, 'center', false);
    const base = 900, cols = [[0, 360, 200, '#ffd700'], [1, 140, 135, '#c0c0c0'], [2, 580, 90, '#cd7f32']];
    for (const [i, x, h, col] of cols) { const m = top[i]; if (!m) continue; const hh = h * k;
      ctx.save(); ctx.fillStyle = col; rr(ctx, x - 104, base - hh, 208, hh + 8, 12); ctx.fill(); ctx.strokeStyle = '#222'; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
      glowText(ctx, String(i + 1), x, base - hh + 52, 56, '#222', '#fff', 'center', false);
      const jump = i === 0 ? Math.abs(Math.sin(t * 5)) * 46 : Math.abs(Math.sin(t * 4 + i)) * 10, s = i === 0 ? 1.2 : .82;
      const c = Object.assign({}, m, { crown: i === 0 }), p = basePose();
      p.ph = t * 9; p.amp = i === 0 ? .55 : .2; p.wob = Math.sin(t * 10) * .9; p.headBob = Math.sin(t * 9) * 4; p.headTilt = -.15; p.mouth = .9; p.tongue = i === 0; p.flail = i === 0; p.jockeyBob = -Math.abs(Math.sin(t * 9)) * 6; p.arms = 2.5 + Math.sin(t * 12 + i) * .4;
      drawCamel(ctx, c, x - 10, base - hh - jump, s, t, p);
      nameTag(c, x, base - hh - 222 * s - jump, Math.max(.8, s * .9), i === 0);
    }
    champsPanel(950);
    if (mode === 'finished' && !LOWQ && fx() < .05) burstConfetti(80 + fx() * 560, 130, 30);
  }

  // ---------- test mode: pretend names, cartoon placeholder faces, endless races ----------
  const FAKE = ['Neon Nina', 'Cassette Kev', 'Rubik Rita', 'Walkman Wayne', 'Synth Sue', 'Arcade Andy', 'Mixtape Mia', 'Boombox Barry', 'Leg-Warmer Liz', 'Pac-Man Pete', 'Big Hair Brenda', 'Atari Annie'];
  const COLORS = ['#ff2bd6', '#00f0ff', '#ffe600', '#a74bff', '#39ff14', '#ff7a00', '#ff3860', '#3d7bff', '#ffffff', '#00ffa8', '#ff9cf0', '#c6ff00'];
  let testSt = null, testChamps = {};
  function testState(phase, extra) { testSt = Object.assign({ now: Date.now(), phase, champs: Object.entries(testChamps).map(([id, c]) => ({ id, name: c.name, wins: c.wins })).sort((a, b) => b.wins - a.wins), auto: { on: false, minutes: 3 } }, testSt && { marbles: testSt.marbles, raceId: testSt.raceId, seed: testSt.seed, startAt: testSt.startAt, openedAt: testSt.openedAt }, extra || {}); return testSt; }
  function testLoop() {
    const n = +(q.get('n') || 8);
    testSt = null; applyState(testState('entries', { marbles: [], openedAt: Date.now() }), 'open');
    let i = 0; const iv = setInterval(() => { if (i >= Math.min(n, 36)) { clearInterval(iv); setTimeout(() => applyState(testState('countdown', { raceId: 'test' + Date.now(), seed: q.get('seed') ? +q.get('seed') : (Math.random() * 4e9) >>> 0, startAt: Date.now() + 4000 }), 'start'), +(q.get('hold') || 1500)); return; }
      const nm = FAKE[i % FAKE.length] + (i >= FAKE.length ? ' ' + (1 + Math.floor(i / FAKE.length)) : ''), m = { id: 't' + i, name: nm, color: COLORS[i % COLORS.length], avatar: null, fake: true }; i++;
      applyState(testState('entries', { marbles: (testSt.marbles || []).concat(m) }), 'join', { marble: m });
    }, +(q.get('joinms') || 400));
  }
  function testFinish(order) {
    const w = sim.cs.find(m => m.id === order[0]); const c = testChamps[w.id] || { name: w.name, wins: 0 }; c.wins++; testChamps[w.id] = c;
    applyState(testState('finished', { results: order.map((id, i) => ({ place: i + 1, id, name: sim.cs.find(m => m.id === id).name })) }), 'result');
    if (q.get('loop') !== '0') setTimeout(testLoop, +(q.get('pause') || 14000));
  }
  buildBg();
  window.__camelSim = simulate;
  if (TEST) { testLoop(); requestAnimationFrame(frame); return; }

  // ---------- live data (same box link + state as the marble race) ----------
  const PATH = q.get('channel') === 'test' ? '/events?channel=test' : '/events';
  const getState = () => fetch(BOX + '/api/marble/state', { headers: H_, cache: 'no-store' }).then(r => r.json()).then(st => applyState(st, 'init')).catch(() => {});
  getState();
  let ctrl = null, lastData = Date.now(), running = false;
  async function run() {
    if (running) return; running = true; lastData = Date.now(); ctrl = new AbortController();
    try {
      const r = await fetch(BOX + PATH, { headers: Object.assign({ Accept: 'text/event-stream' }, H_), cache: 'no-store', signal: ctrl.signal });
      if (!r.ok || !r.body) throw new Error('status ' + r.status);
      getState();
      const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '';
      for (;;) {
        const { value, done } = await rd.read(); if (done) break;
        lastData = Date.now(); buf += dec.decode(value, { stream: true }).replace(/\r/g, '');
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
          const data = chunk.split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).replace(/^ /, '')).join('\n');
          if (data) { try { const d = JSON.parse(data); if (d && d.type === 'marble') { if (d.ev === 'cheer') toast(`${clip(d.name || 'Someone', 18)} cheers their camel on!`, T.accent2); else applyState(d.state, d.ev, d); } } catch (e) {} }
        }
      }
    } catch (e) {}
    try { ctrl.abort(); } catch (e) {}
    running = false; setTimeout(run, 3000);
  }
  setInterval(() => { if (running && Date.now() - lastData > 45000) { try { ctrl.abort(); } catch (e) {} } }, 10000);
  setInterval(() => { if (mode === 'idle' || mode === 'entries' || mode === 'over' || mode === 'podiumOnly' || mode === 'finished') getState(); }, 15000);
  run();
  requestAnimationFrame(frame);
})();
</script>
