      else { p = basePose(); p.wob = Math.sin(t * 2 + i) * .25; p.neck = Math.sin(t * 1.4 + i) * .12; p.headTilt = Math.sin(t * 1.1 + i) * .1; p.headTurn = Math.sin(t * .7 + i) * .35; p.arms = mode === 'countdown' ? 1.8 + Math.sin(t * 8 + i) * .3 : .5 + Math.sin(t * 2 + i) * .2; p.bob = Math.abs(Math.sin(t * 1.5 + i)) * .03; }
      let s = 1; if (mode === 'entries' && c.joinT) { const pk = clamp((performance.now() - c.joinT) / 600, 0, 1); s = .2 + .8 * ease(pk) + Math.sin(pk * Math.PI) * .22; }
      g.scale.setScalar(s); applyPose(g, p, t);
      c.crown = !!(curLeader && c.id === curLeader.id && live && raceT > 1.5); if (c.crown) crownOn = g;
      if (live && v > 40 && fx() < (LOWQ ? .3 : .75) * dt * 60) puff(x - .6 + (fx() - .5), .15, z + (fx() - .5) * .8, e && e.type === 'burst');
      if (e && e.type === 'tumble' && k > .85 && fx() < .6) for (let j = 0; j < 3; j++) puff(x + (fx() - .5) * 2, .2, z + (fx() - .5), true);
      if (e && e.type === 'sulk' && k < .2 && fx() < .5) puff(x, .2, z + (fx() - .5), true);
      if (e && live) { const key2 = c.id + '|' + e.t0; if (!seenEv.has(key2)) { seenEv.add(key2); const opts = SAY[e.type], pick = opts[Math.floor(e.side * opts.length)]; c.say = { s: pick[0], until: e.t0 + Math.max(1.3, e.d), type: e.type }; if (mode === 'racing') toast(pick[1].replace('{n}', clip(c.name, 16)), e.type === 'burst' ? T.accent2 : T.accent3, true); }
        if (e.type === 'spit' && k > .45 && c.spat !== key2) { c.spat = key2; g.updateMatrixWorld(true); g.userData.head.getWorldPosition(v3); spit(v3.x + .6, v3.y - .1, v3.z, v * K); } }
    });
    if (showRace && crownOn) { crownOn.updateMatrixWorld(true); crownOn.userData.face.getWorldPosition(v3); crown.position.set(v3.x, v3.y + .5, v3.z); crown.rotation.y = t * 1.5; crown.visible = true; crown.scale.setScalar(1); }
    else if (podCamels[0]) { const g = podCamels[0]; const hop = Math.abs(Math.sin(t * 4.5)) * .6; g.position.y = PODS[0][2] + hop; g.updateMatrixWorld(true); g.userData.face.getWorldPosition(v3); crown.position.set(v3.x, v3.y + .5, v3.z); crown.rotation.y = t * 1.5; crown.visible = true; }
    else crown.visible = false;
    podCamels.forEach((g, i) => { const p = basePose(); p.ph = t * 8; p.amp = i === 0 ? .55 : .2; p.wob = Math.sin(t * 9 + i) * .9; p.neck = Math.sin(t * 8) * .15; p.tongue = i === 0; p.arms = 2.4; p.wave = true; p.bob = i ? Math.abs(Math.sin(t * 4 + i)) * .08 : 0; applyPose(g, p, t); });
    if ((mode === 'finished' || mode === 'podiumOnly') && fx() < (LOWQ ? .04 : .1)) burstConfetti(POD_X + (fx() - .5) * 10, 10, (fx() - .5) * 6, 26);
    for (const b of balloons) { b.position.y += Math.sin(t * .3 + b.userData.p) * .004; b.position.x += dt * .4; }
    stepParticles(dt); stepToasts(now);
    direct(now, t, dt, cs, pos);
    dMat.uniforms.scale.value = (VH * RS / 2) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    window.__camel = { mode, raceT, slow, grab, shot: cam.shot, cpos: [cam.pos.x, cam.pos.y, cam.pos.z, cam.side, F.L, F.Lz, cam.from ? 1 : 0].map(v => +(+v).toFixed(1)), winner: sim && sim.order[0] ? sim.order[0].name : null, cross: sim && sim.order[0] ? sim.order[0].cross : null, fps: fpsS.fps, stage: fpsS.stage, scale: RS };
    if (window.__camelSkip) return;
    try { composer.render(); } catch (e) { console.error(e); }
    if (photo === 'pending') { // freeze the moment the winner crosses the line (3D only, no HUD)
      const src = renderer.domElement, sz = Math.min(src.width, src.height) * .78; photoC = document.createElement('canvas'); photoC.width = photoC.height = Math.round(sz); const g = photoC.getContext('2d');
      const w = camels.get(sim.order[0].id); let cx = src.width / 2, cy = src.height * .55; if (w) { w.userData.body.getWorldPosition(v3); const s = toScreen(v3); cx = clamp(s.x * RS, sz / 2, src.width - sz / 2); cy = clamp((s.y - 40) * RS, sz / 2, src.height - sz / 2); }
      try { g.drawImage(src, cx - sz / 2, cy - sz / 2, sz, sz, 0, 0, sz, sz); } catch (e) {} photo = 'ready';
    }
    ctx.setTransform(RS, 0, 0, RS, 0, 0); ctx.clearRect(0, 0, VW, VH);
    drawHud(t, now, cs, pos, curLeader);
    if (now - flashAt < 450) { ctx.save(); ctx.fillStyle = `rgba(255,255,255,${.9 * (1 - (now - flashAt) / 450)})`; ctx.fillRect(0, 0, VW, VH); ctx.restore(); }
    drawToasts(now);
    if (SHOWFPS) { ctx.fillStyle = '#0f0'; ctx.font = '700 18px monospace'; ctx.textAlign = 'left'; ctx.fillText(`${fpsS.fps.toFixed(0)} fps  x${RS.toFixed(2)}${fpsS.stage ? ' step ' + fpsS.stage : ''}`, 10, VH - 10); }
    window.__c3dOK = true;
  }

  // ---------- test mode: pretend names, cartoon placeholder faces, endless races ----------
  const FAKE = ['Neon Nina', 'Cassette Kev', 'Rubik Rita', 'Walkman Wayne', 'Synth Sue', 'Arcade Andy', 'Mixtape Mia', 'Boombox Barry', 'Leg-Warmer Liz', 'Pac-Man Pete', 'Big Hair Brenda', 'Atari Annie'];
  const COLORS = ['#ff2bd6', '#00f0ff', '#ffe600', '#a74bff', '#39ff14', '#ff7a00', '#ff3860', '#3d7bff', '#ffffff', '#00ffa8', '#ff9cf0', '#c6ff00'];
  let testSt = null, testChamps = {};
  function testState(phase, extra) { testSt = Object.assign({ now: Date.now(), phase, champs: Object.entries(testChamps).map(([id, c]) => ({ id, name: c.name, wins: c.wins })).sort((a, b) => b.wins - a.wins), auto: { on: false, minutes: 3 } }, testSt && { marbles: testSt.marbles, raceId: testSt.raceId, seed: testSt.seed, startAt: testSt.startAt, openedAt: testSt.openedAt }, extra || {}); return testSt; }
  function testLoop() {
    const n = +(q.get('n') || 8);
    testSt = null; applyState(testState('entries', { marbles: [], openedAt: Date.now() }), 'open');
    let i = 0; const iv = setInterval(() => { if (i >= Math.min(n, 40)) { clearInterval(iv); setTimeout(() => applyState(testState('countdown', { raceId: 'test' + Date.now(), seed: q.get('seed') ? +q.get('seed') : (Math.random() * 4e9) >>> 0, startAt: Date.now() + 4000 }), 'start'), +(q.get('hold') || 1500)); return; }
      const nm = FAKE[i % FAKE.length] + (i >= FAKE.length ? ' ' + (1 + Math.floor(i / FAKE.length)) : ''), m = { id: 't' + i, name: nm, color: COLORS[i % COLORS.length], avatar: null, fake: true }; i++;
      applyState(testState('entries', { marbles: (testSt.marbles || []).concat(m) }), 'join', { marble: m });
    }, +(q.get('joinms') || 400));
  }
  function testFinish(order) {
    const w = sim.cs.find(m => m.id === order[0]); const c = testChamps[w.id] || { name: w.name, wins: 0 }; c.wins++; testChamps[w.id] = c;
    applyState(testState('finished', { results: order.map((id, i) => ({ place: i + 1, id, name: sim.cs.find(m => m.id === id).name })) }), 'result');
    if (q.get('loop') !== '0') setTimeout(testLoop, +(q.get('pause') || 14000));
  }
  window.__camelSim = simulate;
  if (TEST) { testLoop(); requestAnimationFrame(frame); return; }

  // ---------- live data (same box link + state as the marble race) ----------
  const PATH = q.get('channel') === 'test' ? '/events?channel=test' : '/events';
  const getState = () => fetch(BOX + '/api/marble/state', { headers: H_, cache: 'no-store' }).then(r => r.json()).then(st => applyState(st, 'init')).catch(() => {});
  getState();
  let ctrl = null, lastData = Date.now(), running = false;
  async function run() {
    if (running) return; running = true; lastData = Date.now(); ctrl = new AbortController();
    try {
      const r = await fetch(BOX + PATH, { headers: Object.assign({ Accept: 'text/event-stream' }, H_), cache: 'no-store', signal: ctrl.signal });
      if (!r.ok || !r.body) throw new Error('status ' + r.status);
      getState();
      const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '';
      for (;;) {
        const { value, done } = await rd.read(); if (done) break;
        lastData = Date.now(); buf += dec.decode(value, { stream: true }).replace(/\r/g, '');
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
          const data = chunk.split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).replace(/^ /, '')).join('\n');
          if (data) { try { const d = JSON.parse(data); if (d && d.type === 'marble') { if (d.ev === 'cheer') toast(`${clip(d.name || 'Someone', 18)} cheers their camel on!`, T.accent2); else applyState(d.state, d.ev, d); } } catch (e) {} }
        }
      }
    } catch (e) {}
    try { ctrl.abort(); } catch (e) {}
    running = false; setTimeout(run, 3000);
  }
  setInterval(() => { if (running && Date.now() - lastData > 45000) { try { ctrl.abort(); } catch (e) {} } }, 10000);
  setInterval(() => { if (mode === 'idle' || mode === 'entries' || mode === 'over' || mode === 'podiumOnly' || mode === 'finished') getState(); }, 15000);
  run();
  requestAnimationFrame(frame);
})();
</script>
