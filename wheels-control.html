<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<title>Wheels – Grumpy's control</title>
<style>
:root{--pink:#ff2bd6;--cyan:#00f0ff;--yel:#ffe600;--grn:#39ff14}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#12002a;color:#fff;padding:14px 14px 40px;max-width:560px;margin:auto}
h1{font-size:22px;margin:4px 0 2px;color:var(--yel);text-shadow:0 0 10px var(--pink)}.sub{color:#bba;font-size:13px;margin-bottom:12px}
.card{background:#220a44;border:2px solid #4a2380;border-radius:14px;padding:12px;margin:10px 0}
button{font:inherit;font-weight:900;font-size:26px;border:0;border-radius:16px;padding:28px 10px;width:100%;color:#111;cursor:pointer;touch-action:manipulation;margin:8px 0}
button:active{transform:scale(.97)}button:disabled{opacity:.4}
.g{background:#c9dc6a}.e{background:#19b5ff}.b{background:var(--pink);color:#fff}.ghost{background:#3a2366;color:#fff;font-size:15px;padding:12px}
input{font:inherit;font-size:17px;padding:10px;border-radius:10px;border:2px solid #4a2380;background:#0e0020;color:#fff;width:100%}
.msg{min-height:24px;color:var(--yel);font-weight:700;margin-top:8px;font-size:18px}
</style></head><body>
<h1>🎡 Wheels – control</h1>
<div class="sub">Only for Grumpy. Spins the Genre / Era wheels on the overlay. The result is picked at random on the overlay.</div>
<div class="card" id="keyCard" hidden>
  <div style="font-weight:700;margin-bottom:6px">Enter the game key (same key as the vote and marble race – remembered on this phone)</div>
  <input id="key" type="password" autocomplete="off" placeholder="game key">
  <button class="ghost" id="saveKey">Save key</button>
</div>
<div class="card">
  <button class="g" data-w="genre">🎸 Spin GENRE</button>
  <button class="e" data-w="era">📅 Spin ERA</button>
  <button class="b" data-w="both">🎡 Spin BOTH</button>
  <div class="msg" id="msg"></div>
</div>
<div class="card"><button class="ghost" id="bKey">Change key</button></div>
<script>
let BOX = 'https://approach-grandkid-sermon.ngrok-free.dev'; const H = { 'ngrok-skip-browser-warning': '1' };
{ const bq = new URLSearchParams(location.search).get('box'); if (bq && /^http:\/\/(localhost|127\.0\.0\.1):\d+$/.test(bq)) BOX = bq; }
const $ = id => document.getElementById(id);
let KEY = localStorage.getItem('marbleKey') || '';
function msg(s, bad) { $('msg').textContent = s || ''; $('msg').style.color = bad ? '#ff7a9a' : ''; }
function showKey(v) { $('keyCard').hidden = !v; if (v) $('key').focus(); }
async function call(path, body) {
  if (!KEY) { showKey(true); msg('Enter the key first', true); return null; }
  try {
    const r = await fetch(BOX + '/api/wheels/' + path, { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json', 'x-key': KEY }, H), body: JSON.stringify(body || {}) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 403) { msg('Wrong key – enter it again', true); showKey(true); return null; }
    if (r.status === 429) { msg('⏳ One sec – already spinning', true); return j; }
    if (j.ok === false) msg('⚠️ ' + (j.error || 'not possible'), true);
    return j;
  } catch (e) { msg('Can\'t reach Bob\'s box – try again', true); return null; }
}
document.querySelectorAll('[data-w]').forEach(b => b.onclick = async () => { const w = b.dataset.w; const j = await call('spin', { which: w }); if (j && j.ok) msg('✅ Spinning ' + (w === 'both' ? 'both wheels' : w.toUpperCase()) + '!'); });
$('bKey').onclick = () => showKey(true);
$('saveKey').onclick = async () => { const k = $('key').value.trim(); if (!k) return; const old = KEY; KEY = k; const j = await call('check'); if (j && j.ok) { localStorage.setItem('marbleKey', k); $('key').value = ''; showKey(false); msg('✅ Key saved on this phone'); } else KEY = old; };
if (!KEY) showKey(true);
</script>
</body></html>
